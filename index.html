<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Studio - Complete 6M with Sub-Cause Bones</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for React and Lucide Icons -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import {
            ZoomIn, ZoomOut, RotateCcw, Plus, Download, Printer,
            Sparkles, Info, Layers, ChevronDown, Edit2, Check, X,
            HelpCircle, Eye, EyeOff, Bot, Wand2, Loader2, Trash2, FileText
        } from 'lucide-react';

        // DEFINISI STANDAR 6M DENGAN 6 KATEGORI PENUH
        const PRESETS = {
            '6M': {
                name: '6M (Manufaktur & Rekayasa)',
                problem: 'Tingkat Cacat Produk Meningkat 15%',
                conclusion: 'Kegagalan disebabkan oleh akumulasi keausan mekanis puncher dan variasi ketebalan material yang tidak terdeteksi akibat sensor in-line telat dikalibrasi.',
                categories: [
                    { 
                        id: 'cat-1', name: 'Man (Tenaga Kerja)', color: '#2563EB', 
                        causes: [
                            { 
                                text: 'Kurang pelatihan sertifikasi berkala', 
                                subCause: 'Operator shift malam belum lulus uji sertifikasi mesin presisi', 
                                actionPlan: 'Wajibkan sertifikasi ulang per kuartal dan buat matriks keahlian operator.' 
                            },
                            { 
                                text: 'Kelelahan operator shift 3', 
                                subCause: 'Lembur berturut-turut melebihi batas 14 jam per minggu', 
                                actionPlan: 'Batasi lembur maksimal 2 hari berturut-turut dan perbaiki rotasi shift.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-2', name: 'Machine (Mesin)', color: '#059669', 
                        causes: [
                            { 
                                text: 'Penurunan presisi hidrolik puncher', 
                                subCause: 'Seal silinder hidrolik aus akibat suhu oli melebihi 65°C terus-menerus', 
                                actionPlan: 'Ganti seal silinder hidrolik tahan panas dan pasang modul chiller pendingin.' 
                            },
                            { 
                                text: 'Keausan guide pin pada die block', 
                                subCause: 'Clearance guide pin melebihi batas toleransi 0.08 mm', 
                                actionPlan: 'Ganti guide pin baru dan lakukan flushing pada sistem lubrikasi otomatis.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-3', name: 'Method (Metode)', color: '#D97706', 
                        causes: [
                            { 
                                text: 'SOP pemeliharaan berkala usang', 
                                subCause: 'Parameter inspeksi cetakan masih mengacu pada mesin tipe lama', 
                                actionPlan: 'Revisi Work Instruction bersama engineering dan buat checklist digital.' 
                            },
                            { 
                                text: 'Prosedur setup die tidak standar', 
                                subCause: 'Teknisi mengencangkan baut clamping tanpa menggunakan kunci torsi', 
                                actionPlan: 'Wajibkan kunci torsi terkalibrasi dan pasang visual board urutan baut.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-4', name: 'Material (Bahan Baku)', color: '#DB2777', 
                        causes: [
                            { 
                                text: 'Ketebalan pelat melebihi toleransi', 
                                subCause: 'Deviasi bahan supplier ±0.15 mm dari ambang 0.05 mm tanpa uji inbound', 
                                actionPlan: 'Perketat kriteria penerimaan material inbound dan terbitkan CAR ke supplier.' 
                            },
                            { 
                                text: 'Residu pelindung karat berlebih', 
                                subCause: 'Oli pelindung terlalu kental sehingga menjebak gram sisa pemotongan', 
                                actionPlan: 'Tetapkan standar viskositas oli ke vendor dan pasang air blow cleaner.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-5', name: 'Measurement (Pengukuran)', color: '#7C3AED', 
                        causes: [
                            { 
                                text: 'Sensor ketebalan tidak terkalibrasi', 
                                subCause: 'Sensor ultrasonik telat kalibrasi 45 hari dan lensa tertutup kabut oli', 
                                actionPlan: 'Kalibrasi ulang sensor dan jadwalkan pembersihan lensa harian.' 
                            },
                            { 
                                text: 'Metode sampling QC tidak memadai', 
                                subCause: 'Pemeriksaan dimensi hanya dilakukan pada 5 part awal tiap ganti coil', 
                                actionPlan: 'Terapkan Statistical Process Control (SPC) per 500 stroke berkala.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-6', name: 'Milieu / Environment (Lingkungan)', color: '#0891B2', 
                        causes: [
                            { 
                                text: 'Kelembapan ruang produksi tinggi', 
                                subCause: 'Kelembapan 85% memicu bintik karat mikro pada permukaan cetakan cadangan', 
                                actionPlan: 'Pasang industrial dehumidifier dan perbaiki ventilasi aktif lantai produksi.' 
                            },
                            { 
                                text: 'Akumulasi debu abrasif lini sebelah', 
                                subCause: 'Partisi area gerinda dan stamping presisi hanya berupa tirai plastik', 
                                actionPlan: 'Bangun sekat partisi sandwich panel kedap debu dan pasang dust collector.' 
                            }
                        ] 
                    }
                ]
            },
            '4P': {
                name: '4P (Pemasaran & Layanan)',
                problem: 'Konversi Penjualan Kuartal Ini Menurun',
                conclusion: 'Penurunan konversi disebabkan oleh kendala performa teknis di checkout mobile serta struktur harga yang kalah kompetitif dari promosi kompetitor.',
                categories: [
                    { id: 'cat-1', name: 'Product (Produk)', color: '#2563EB', causes: [{ text: 'Fitur baru membingungkan user', subCause: 'Navigasi diubah tanpa tutorial onboarding bertahap', actionPlan: 'Rilis interactive product tour 3 langkah.' }] },
                    { id: 'cat-2', name: 'Price (Harga)', color: '#059669', causes: [{ text: 'Struktur harga kurang kompetitif', subCause: 'Kompetitor meluncurkan diskon 40% skema langganan tahunan', actionPlan: 'Luncurkan paket bundling tahunan fleksibel.' }] },
                    { id: 'cat-3', name: 'Place (Saluran)', color: '#D97706', causes: [{ text: 'Latency tinggi di checkout mobile', subCause: 'Payment gateway sering timeout > 8 detik di jam sibuk', actionPlan: 'Gunakan multi-gateway auto-routing.' }] },
                    { id: 'cat-4', name: 'Promotion (Promosi)', color: '#DB2777', causes: [{ text: 'Targeting iklan meleset', subCause: 'Data demografi audiens belum diperbarui pasca update OS', actionPlan: 'Gunakan Conversion API sisi server.' }] }
                ]
            }
        };

        const COLOR_PALETTE = ['#2563EB', '#059669', '#D97706', '#DB2777', '#7C3AED', '#0891B2', '#DC2626', '#0D9488'];

        const wrapText = (text, maxChars) => {
            if (!text) return [''];
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            words.forEach((word) => {
                if ((currentLine + word).length > maxChars) {
                    if (currentLine) lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine += word + ' ';
                }
            });
            if (currentLine) lines.push(currentLine.trim());
            return lines.length > 0 ? lines : [''];
        };

        const formatPresetData = (preset) => {
            return {
                ...preset,
                conclusion: preset.conclusion || '',
                problemOffsetX: 0, problemOffsetY: 0,
                categories: preset.categories.map((c, i) => ({
                    ...c,
                    offsetX: 0, offsetY: 0, boneOffsetX: 0, boneOffsetY: 0,
                    causes: c.causes.map((item, j) => {
                        const isObj = typeof item === 'object' && item !== null;
                        return {
                            id: `cause-${i}-${j}-${Date.now()}`,
                            text: isObj ? item.text : item,
                            subCause: isObj ? (item.subCause || '') : '',
                            actionPlan: isObj ? (item.actionPlan || '') : '',
                            pic: isObj ? (item.pic || '') : '',
                            dueDate: isObj ? (item.dueDate || '') : '',
                            offsetX: 0, offsetY: 0, customWidth: null
                        };
                    })
                }))
            };
        };

        // DIMENSI SVG RESPONSIVE UNTUK 6 KATEGORI (3 ATAS, 3 BAWAH)
        const SVG_WIDTH = 1520;
        const SVG_HEIGHT = 880;
        const SPINE_Y = SVG_HEIGHT / 2;
        const SPINE_START_X = 140;
        const SPINE_END_X = 1240;

        function App() {
            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem('fishbone_diagram_data_v9');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        // Jika tersimpan kurang dari 6 kategori pada preset 6M, paksa muat 6M penuh
                        if (parsed.categories && parsed.categories.length >= 6) return parsed;
                    }
                } catch (e) {}
                return formatPresetData(PRESETS['6M']);
            });

            const [activePreset, setActivePreset] = useState('6M');
            const [zoom, setZoom] = useState(1);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isPanning, setIsPanning] = useState(false);
            const [startPan, setStartPan] = useState({ x: 0, y: 0 });
            
            const [dragItem, setDragItem] = useState(null);
            const [tempOffsets, setTempOffsets] = useState({});
            const [highlightedCause, setHighlightedCause] = useState(null);

            const [showPresetsMenu, setShowPresetsMenu] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            // AI State
            const [showAIModal, setShowAIModal] = useState(false);
            const [aiPrompt, setAiPrompt] = useState('');
            const [aiModel, setAiModel] = useState(() => localStorage.getItem('gemini_model') || 'gemini-3.1-flash-lite');
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiError, setAiError] = useState('');

            const containerRef = useRef(null);
            const svgRef = useRef(null);

            useEffect(() => {
                try { localStorage.setItem('fishbone_diagram_data_v9', JSON.stringify(data)); } catch (e) {}
            }, [data]);

            // INTERAKSI POINTER / PANNING
            const handlePointerDown = (e) => {
                if (e.target.closest('button') || e.target.closest('.no-pan') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('td') || editingItem) return;
                setIsPanning(true);
                setStartPan({ x: e.clientX - pan.x, y: e.clientY - pan.y });
                setHighlightedCause(null);
            };

            const handlePointerMove = (e) => {
                if (dragItem) {
                    const dx = (e.clientX - dragItem.startX) / zoom;
                    const dy = (e.clientY - dragItem.startY) / zoom;
                    if (dragItem.type === 'resize') {
                        setTempOffsets({ [dragItem.id]: { dw: dx } });
                    } else {
                        setTempOffsets({ [dragItem.id]: { dx, dy } });
                    }
                    return;
                }
                if (isPanning) {
                    setPan({ x: e.clientX - startPan.x, y: e.clientY - startPan.y });
                }
            };

            const handlePointerUp = () => {
                setIsPanning(false);
                if (dragItem) {
                    const offsets = tempOffsets[dragItem.id] || {};
                    setData((prev) => {
                        const next = { ...prev };
                        if (dragItem.type === 'problem') {
                            next.problemOffsetX = (next.problemOffsetX || 0) + (offsets.dx || 0);
                            next.problemOffsetY = (next.problemOffsetY || 0) + (offsets.dy || 0);
                        } else {
                            next.categories = next.categories.map((c) => {
                                if (c.id === dragItem.catId || c.id === dragItem.id) {
                                    const nextCat = { ...c };
                                    if (dragItem.type === 'cat' && dragItem.id === c.id) {
                                        nextCat.offsetX = (nextCat.offsetX || 0) + (offsets.dx || 0);
                                        nextCat.offsetY = (nextCat.offsetY || 0) + (offsets.dy || 0);
                                    }
                                    if (dragItem.type === 'cat_bone' && dragItem.catId === c.id) {
                                        nextCat.boneOffsetX = (nextCat.boneOffsetX || 0) + (offsets.dx || 0);
                                        nextCat.boneOffsetY = (nextCat.boneOffsetY || 0) + (offsets.dy || 0);
                                    }
                                    if ((dragItem.type === 'cause' || dragItem.type === 'resize') && dragItem.catId === c.id) {
                                        nextCat.causes = nextCat.causes.map(cause => {
                                            if (cause.id === dragItem.id) {
                                                return {
                                                    ...cause,
                                                    offsetX: (cause.offsetX || 0) + (offsets.dx || 0),
                                                    offsetY: (cause.offsetY || 0) + (offsets.dy || 0),
                                                    customWidth: dragItem.type === 'resize' ? Math.max(110, (cause.customWidth || dragItem.startWidth) + (offsets.dw || 0)) : cause.customWidth
                                                };
                                            }
                                            return cause;
                                        });
                                    }
                                    return nextCat;
                                }
                                return c;
                            });
                        }
                        return next;
                    });
                    setDragItem(null);
                    setTempOffsets({});
                }
            };

            const startDrag = (e, type, id, catId = null) => {
                e.stopPropagation();
                setDragItem({ type, id, catId, startX: e.clientX, startY: e.clientY });
                if (type === 'cause') setHighlightedCause(id);
            };

            const startResize = (e, id, catId, currentWidth) => {
                e.stopPropagation();
                setDragItem({ type: 'resize', id, catId, startX: e.clientX, startWidth: currentWidth });
            };

            const handleWheel = (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                    setZoom((z) => Math.min(2.5, Math.max(0.4, z * zoomFactor)));
                }
            };

            // CRUD HANDLERS
            const handleAddCategory = () => {
                const newId = `cat-${Date.now()}`;
                const nextColor = COLOR_PALETTE[data.categories.length % COLOR_PALETTE.length];
                setData((prev) => ({
                    ...prev,
                    categories: [...prev.categories, { id: newId, name: `Kategori Baru ${data.categories.length + 1}`, color: nextColor, offsetX: 0, offsetY: 0, causes: [{ id: `cause-${Date.now()}`, text: 'Penyebab Baru', subCause: 'Rincian sub-cause baru', actionPlan: '', pic: '', dueDate: '', offsetX: 0, offsetY: 0, customWidth: null }] }]
                }));
            };

            const handleDeleteCategory = (catId, e) => {
                if (e) e.stopPropagation();
                if (data.categories.length <= 1) return;
                setData((prev) => ({ ...prev, categories: prev.categories.filter((c) => c.id !== catId) }));
            };

            const handleAddCause = (catId, e) => {
                if (e) e.stopPropagation();
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            return { ...c, causes: [...c.causes, { id: `cause-${Date.now()}`, text: 'Penyebab baru', subCause: 'Penjelasan sub-cause lanjutan...', actionPlan: '', pic: '', dueDate: '', offsetX: 0, offsetY: 0, customWidth: null }] };
                        }
                        return c;
                    })
                }));
            };

            const handleDeleteCause = (catId, causeIdx, e) => {
                if (e) e.stopPropagation();
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            const nextCauses = [...c.causes];
                            nextCauses.splice(causeIdx, 1);
                            return { ...c, causes: nextCauses };
                        }
                        return c;
                    })
                }));
            };

            const handleTableEdit = (catId, causeId, field, value) => {
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            return {
                                ...c,
                                causes: c.causes.map((cause) => {
                                    if (cause.id === causeId) return { ...cause, [field]: value };
                                    return cause;
                                })
                            };
                        }
                        return c;
                    })
                }));
            };

            const saveQuickEdit = (newText, newSubCause) => {
                if (!editingItem) return;
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === editingItem.catId) {
                            const updatedCauses = [...c.causes];
                            updatedCauses[editingItem.causeIndex] = {
                                ...updatedCauses[editingItem.causeIndex],
                                text: newText.trim() || updatedCauses[editingItem.causeIndex].text,
                                subCause: newSubCause.trim()
                            };
                            return { ...c, causes: updatedCauses };
                        }
                        return c;
                    })
                }));
                setEditingItem(null);
            };

            // AI GENERATE DENGAN GARANSI 6 KATEGORI
            const handleAIGenerate = async () => {
                if (!aiPrompt.trim()) return setAiError("Deskripsi masalah wajib diisi.");
                setIsGenerating(true);
                setAiError('');
                localStorage.setItem('gemini_model', aiModel);

                // Kirim daftar 6M jika template 6M aktif
                const expectedCategories = (activePreset === '6M' && data.categories.length < 6)
                    ? PRESETS['6M'].categories.map(c => c.name)
                    : data.categories.map(c => c.name);

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: aiPrompt,
                            model: aiModel,
                            expectedCategories: expectedCategories
                        })
                    });

                    const resJson = await response.json();
                    if (!response.ok) throw new Error(resJson.error || 'Gagal memproses data melalui server.');

                    let parsedData;
                    try {
                        parsedData = JSON.parse(resJson.result);
                    } catch (e) {
                        parsedData = JSON.parse(resJson.result.replace(/```json/gi, '').replace(/```/gi, '').trim());
                    }

                    const mappedCategories = (parsedData.categories || []).map((cat, i) => {
                        const existingColor = data.categories[i]?.color || COLOR_PALETTE[i % COLOR_PALETTE.length];
                        return {
                            id: `cat-ai-${Date.now()}-${i}`,
                            name: cat.name || `Kategori ${i + 1}`,
                            color: existingColor,
                            causes: (cat.causes || []).map((item, j) => {
                                const isObj = typeof item === 'object' && item !== null;
                                return {
                                    id: `c-${Date.now()}-${i}-${j}`,
                                    text: isObj ? (item.text || 'Penyebab') : item,
                                    subCause: isObj ? (item.subCause || '') : '',
                                    actionPlan: isObj ? (item.actionPlan || '') : '',
                                    pic: '',
                                    dueDate: ''
                                };
                            })
                        };
                    });

                    setData(formatPresetData({
                        name: 'Hasil Analisis 6M',
                        problem: parsedData.problem || aiPrompt,
                        conclusion: parsedData.conclusion || 'Analisis 6M telah disusun secara komprehensif.',
                        categories: mappedCategories
                    }));

                    setShowAIModal(false);
                    setAiPrompt('');
                    setZoom(1);
                    setPan({ x: 0, y: 0 });
                } catch (err) {
                    setAiError(err.message);
                } finally {
                    setIsGenerating(false);
                }
            };

            const exportPNG = () => {
                if (!svgRef.current) return;
                setIsExporting(true);
                try {
                    const svgElement = svgRef.current.cloneNode(true);
                    svgElement.querySelectorAll('.no-print').forEach(el => el.remove());
                    svgElement.querySelectorAll('.canvas-outer-bg').forEach(el => { 
                        el.setAttribute('fill', '#ffffff'); 
                        el.setAttribute('stroke', '#e2e8f0'); 
                    });
                    
                    const svgBlob = new Blob([new XMLSerializer().serializeToString(svgElement)], { type: 'image/svg+xml;charset=utf-8' });
                    const blobURL = URL.createObjectURL(svgBlob);
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = SVG_WIDTH * 2; canvas.height = SVG_HEIGHT * 2;
                        const ctx = canvas.getContext('2d'); ctx.scale(2, 2);
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, SVG_WIDTH, SVG_HEIGHT);
                        ctx.drawImage(img, 0, 0, SVG_WIDTH, SVG_HEIGHT);
                        const link = document.createElement('a'); 
                        link.download = `Fishbone-6M-${Date.now()}.png`;
                        link.href = canvas.toDataURL('image/png'); 
                        link.click();
                        URL.revokeObjectURL(blobURL); 
                        setIsExporting(false);
                    };
                    img.src = blobURL;
                } catch(e) { 
                    setIsExporting(false); 
                }
            };

            // PENGELOMPOKAN 6 KATEGORI: 3 DI ATAS, 3 DI BAWAH
            const topCategories = data.categories.filter((_, idx) => idx % 2 === 0);
            const bottomCategories = data.categories.filter((_, idx) => idx % 2 !== 0);

            // GEOMETRI TULANG KATEGORI (DISTRIBUSI RATA DI SEPANJANG TULANG BELAKANG)
            const getRibMetrics = (index, total, isTop) => {
                const availableLength = SPINE_END_X - SPINE_START_X - 60;
                const step = total > 1 ? availableLength / total : availableLength / 2;
                const baseX = SPINE_START_X + 60 + index * step + step * 0.45;
                const ribLength = 290;
                const dx = Math.cos(Math.PI / 3) * ribLength; // 60 derajat
                const dy = Math.sin(Math.PI / 3) * ribLength;
                return { 
                    baseX, 
                    baseY: SPINE_Y, 
                    tipX: baseX - dx, 
                    tipY: isTop ? SPINE_Y - dy : SPINE_Y + dy, 
                    step 
                };
            };

            return (
                <div className="flex flex-col min-h-screen bg-slate-100">
                    <style>{`
                        @media print {
                            @page { size: A4 landscape; margin: 8mm; }
                            body { background: white !important; }
                            header, .no-print, #canvas-bg { display: none !important; }
                            .print-wrapper { height: auto !important; overflow: visible !important; display: block !important; }
                            .diagram-scalable-wrapper { transform: scale(0.58) !important; transform-origin: top left !important; margin-bottom: 20px;}
                            .table-wrapper { page-break-inside: avoid; }
                        }
                        ::-webkit-scrollbar { width: 8px; height: 8px; }
                        ::-webkit-scrollbar-track { background: #f1f5f9; }
                        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
                        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
                    `}</style>

                    {/* HEADER */}
                    <header className="h-16 bg-white border-b border-slate-200 px-4 md:px-6 flex items-center justify-between z-30 shrink-0 shadow-sm sticky top-0">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-md">
                                <svg className="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12h14" /><path d="M16 12l5-5v10z" /><path d="M6 12l3-5" /><path d="M6 12l3 5" /><path d="M11 12l3-5" /><path d="M11 12l3 5" /></svg>
                            </div>
                            <div>
                                <h1 className="text-lg font-bold tracking-tight text-slate-800 flex items-center gap-2">
                                    Fishbone Studio <span className="text-[10px] font-medium uppercase px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 border border-blue-200">6M Full Bones</span>
                                </h1>
                                <p className="text-xs text-slate-500 hidden sm:block">Root Cause & Action Plan Manager</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            <div className="relative">
                                <button onClick={() => setShowPresetsMenu(!showPresetsMenu)} className="flex items-center space-x-1.5 px-3 py-1.5 text-sm font-medium bg-white hover:bg-slate-50 rounded-lg border border-slate-300 text-slate-700 transition">
                                    <Layers className="w-4 h-4 text-blue-600" /> <span className="hidden md:inline">{PRESETS[activePreset]?.name || 'Template'}</span> <ChevronDown className="w-3.5 h-3.5" />
                                </button>
                                {showPresetsMenu && (
                                    <div className="absolute right-0 top-full mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-200 p-1.5 z-50">
                                        <div className="text-[11px] font-semibold text-slate-500 uppercase px-2 py-1">Pilih Template</div>
                                        {Object.keys(PRESETS).map((key) => (
                                            <button key={key} onClick={() => { setData(formatPresetData(PRESETS[key])); setActivePreset(key); setShowPresetsMenu(false); }} className={`w-full text-left px-3 py-2 text-xs rounded-lg flex justify-between ${activePreset === key ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-600 hover:bg-slate-100'}`}>
                                                <span>{PRESETS[key].name}</span>{activePreset === key && <Check className="w-3.5 h-3.5 text-blue-600" />}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <button onClick={() => setShowAIModal(true)} className="flex items-center space-x-1.5 px-3 py-1.5 text-sm font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg transition">
                                <Bot className="w-4 h-4" /><span className="hidden sm:inline">AI Generate ({data.categories.length} Kategori)</span>
                            </button>
                            <button onClick={handleAddCategory} className="flex items-center space-x-1.5 px-3 py-1.5 text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-sm transition">
                                <Plus className="w-4 h-4" /><span className="hidden sm:inline">Kategori</span>
                            </button>
                            <div className="h-5 w-px bg-slate-300 hidden sm:block mx-1" />
                            <button onClick={exportPNG} className="flex items-center px-3 py-1.5 text-sm font-medium bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 rounded-lg transition">
                                <Download className="w-4 h-4 text-emerald-600 mr-1.5" /><span className="hidden md:inline">PNG</span>
                            </button>
                            <button onClick={() => window.print()} className="flex items-center px-3 py-1.5 text-sm font-medium bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 rounded-lg transition">
                                <Printer className="w-4 h-4 text-purple-600 mr-1.5" /><span className="hidden md:inline">Print/PDF</span>
                            </button>
                        </div>
                    </header>

                    {/* CANVAS WORKSPACE DENGAN TULANG SUB-CAUSE TERHUBUNG */}
                    <div ref={containerRef} onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onWheel={handleWheel} className={`relative w-full h-[62vh] shrink-0 bg-slate-50 overflow-hidden flex items-center justify-center border-b border-slate-200 shadow-inner cursor-${isPanning ? 'grabbing' : 'grab'} print-wrapper`}>
                        <div id="canvas-bg" className="absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:24px_24px] opacity-60 pointer-events-none" />
                        
                        <div className="absolute bottom-4 left-4 flex items-center bg-white border border-slate-200 rounded-xl p-1 shadow-sm z-20 no-print">
                            <button onClick={() => setZoom(z => Math.min(2.2, z + 0.15))} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><ZoomIn className="w-4 h-4" /></button>
                            <span className="text-xs font-mono px-2 text-slate-500 w-12 text-center">{Math.round(zoom * 100)}%</span>
                            <button onClick={() => setZoom(z => Math.max(0.4, z - 0.15))} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><ZoomOut className="w-4 h-4" /></button>
                            <div className="h-4 w-px bg-slate-200 mx-1" />
                            <button onClick={() => { setZoom(1); setPan({ x: 0, y: 0 }); }} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><RotateCcw className="w-4 h-4" /></button>
                        </div>

                        <div className="absolute top-3 left-4 text-xs text-slate-500 pointer-events-none no-print flex items-center gap-1.5 bg-white/80 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                            <Sparkles className="w-3.5 h-3.5 text-blue-600" />
                            <span>Setiap Cause memiliki <b>Tulang Cabang</b>, dan Sub-cause memiliki <b>Anak Tulang</b> tersendiri. Double-click untuk mengedit.</span>
                        </div>

                        <div style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`, transformOrigin: 'center center', transition: isPanning ? 'none' : 'transform 0.1s ease-out' }} className="relative diagram-scalable-wrapper">
                            <svg ref={svgRef} width={SVG_WIDTH} height={SVG_HEIGHT} viewBox={`0 0 ${SVG_WIDTH} ${SVG_HEIGHT}`} className="overflow-visible filter drop-shadow-md">
                                <defs>
                                    <marker id="spine-arrow-light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                                        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
                                    </marker>
                                </defs>

                                <rect x="16" y="16" width={SVG_WIDTH - 32} height={SVG_HEIGHT - 32} rx="20" fill="#ffffff" stroke="#e2e8f0" strokeWidth="2" className="canvas-outer-bg" />

                                {/* TULANG BELAKANG (SPINE UTAMA) */}
                                <g className="fish-tail">
                                    <path d={`M ${SPINE_START_X} ${SPINE_Y} L ${SPINE_START_X - 55} ${SPINE_Y - 50} Q ${SPINE_START_X - 70} ${SPINE_Y} ${SPINE_START_X - 55} ${SPINE_Y + 50} Z`} fill="#f1f5f9" stroke="#94a3b8" strokeWidth="2.5" />
                                    <path d={`M ${SPINE_START_X - 15} ${SPINE_Y - 20} L ${SPINE_START_X - 45} ${SPINE_Y - 35}`} stroke="#cbd5e1" strokeWidth="2" />
                                    <path d={`M ${SPINE_START_X - 15} ${SPINE_Y + 20} L ${SPINE_START_X - 45} ${SPINE_Y + 35}`} stroke="#cbd5e1" strokeWidth="2" />
                                </g>
                                <line x1={SPINE_START_X} y1={SPINE_Y} x2={SPINE_END_X} y2={SPINE_Y} stroke="#94a3b8" strokeWidth="4.5" strokeLinecap="round" markerEnd="url(#spine-arrow-light)" />

                                {/* RENDER KATEGORI 6M (3 ATAS, 3 BAWAH) */}
                                {[topCategories, bottomCategories].map((cats, isBottomIdx) => {
                                    const isTop = isBottomIdx === 0;
                                    return cats.map((cat, idx) => {
                                        const { baseX, baseY, tipX, tipY } = getRibMetrics(idx, cats.length, isTop);
                                        const bDx = (cat.boneOffsetX||0) + (tempOffsets[`bone-${cat.id}`]?.dx||0);
                                        const bDy = (cat.boneOffsetY||0) + (tempOffsets[`bone-${cat.id}`]?.dy||0);
                                        const actualBaseX = baseX + bDx, actualBaseY = baseY + bDy;
                                        const actualTipX = tipX + bDx + (cat.offsetX||0) + (tempOffsets[cat.id]?.dx||0);
                                        const actualTipY = tipY + bDy + (cat.offsetY||0) + (tempOffsets[cat.id]?.dy||0);

                                        return (
                                            <g key={cat.id}>
                                                {/* 1. TULANG KATEGORI (DIAGONAL UTAMA 60 DERAJAT) */}
                                                <g className="cursor-grab active:cursor-grabbing group" onPointerDown={(e) => startDrag(e, 'cat_bone', `bone-${cat.id}`, cat.id)}>
                                                    <line x1={actualBaseX} y1={actualBaseY} x2={actualTipX} y2={actualTipY} stroke="transparent" strokeWidth="20" />
                                                    <line x1={actualBaseX} y1={actualBaseY} x2={actualTipX} y2={actualTipY} stroke={cat.color} strokeWidth="3.5" strokeLinecap="round" />
                                                    <circle cx={actualBaseX} cy={actualBaseY} r="5" fill="#fff" stroke={cat.color} strokeWidth="2.5" />
                                                </g>

                                                {/* 2. CABANG TULANG PENYEBAB & ANAK TULANG SUB-PENYEBAB */}
                                                {cat.causes.map((cause, cIdx) => {
                                                    const ratio = (cIdx + 1) / (cat.causes.length + 1);
                                                    const ribPointX = actualBaseX + (actualTipX - actualBaseX) * ratio;
                                                    const ribPointY = actualBaseY + (actualTipY - actualBaseY) * ratio;
                                                    const cDx = tempOffsets[cause.id]?.dx||0, cDy = tempOffsets[cause.id]?.dy||0, cDw = tempOffsets[cause.id]?.dw||0;

                                                    // Panjang tulang cabang penyebab
                                                    const causeBoneLen = 110 + cDw;
                                                    const causeEndX = ribPointX - causeBoneLen;
                                                    const causeEndY = ribPointY;

                                                    // Kotak Cause
                                                    const causeW = Math.max(120, 140 + cDw);
                                                    const causeLines = wrapText(cause.text || '', Math.floor((causeW - 20) / 7.2));
                                                    const causeH = Math.max(30, causeLines.length * 14 + 14);
                                                    const causeBoxX = causeEndX - causeW + (cause.offsetX||0) + cDx;
                                                    const causeBoxY = causeEndY - causeH / 2 + (cause.offsetY||0) + cDy;

                                                    // Titik cabang anak tulang sub-cause (bercabang dari tulang penyebab)
                                                    const subOriginX = ribPointX - 45 + (cause.offsetX||0) + cDx;
                                                    const subOriginY = ribPointY + (cause.offsetY||0) + cDy;

                                                    // Sudut anak tulang sub-cause (diagonal 60 derajat sejajar tulang kategori)
                                                    const subBoneLen = 50;
                                                    const subDx = Math.cos(Math.PI / 3) * subBoneLen; // 25px
                                                    const subDy = Math.sin(Math.PI / 3) * subBoneLen; // 43.3px
                                                    const subTipX = subOriginX - subDx;
                                                    const subTipY = isTop ? (subOriginY - subDy) : (subOriginY + subDy);

                                                    // Kotak Sub-Cause
                                                    const subW = Math.max(130, 150 + cDw);
                                                    const subLines = wrapText(cause.subCause || '(Klik 2x isi sub-cause)', Math.floor((subW - 24) / 6.2));
                                                    const subH = Math.max(26, subLines.length * 12 + 14);
                                                    const subBoxX = subTipX - subW;
                                                    const subBoxY = isTop ? (subTipY - subH + 10) : (subTipY - 10);

                                                    const isHighlighted = highlightedCause === cause.id;

                                                    return (
                                                        <g 
                                                            key={cause.id} 
                                                            className="cause-hierarchical-group cursor-grab active:cursor-grabbing" 
                                                            onPointerDown={(e) => startDrag(e, 'cause', cause.id, cat.id)}
                                                            onDoubleClick={(e) => {
                                                                e.stopPropagation();
                                                                setEditingItem({
                                                                    catId: cat.id,
                                                                    causeIndex: cIdx,
                                                                    text: cause.text,
                                                                    subCause: cause.subCause || ''
                                                                });
                                                            }}
                                                        >
                                                            {/* GARIS TULANG PENYEBAB (HORIZONTAL BONE) */}
                                                            <line x1={ribPointX} y1={ribPointY} x2={causeBoxX + causeW} y2={causeEndY + (cause.offsetY||0) + cDy} stroke={cat.color} strokeWidth="2.5" strokeLinecap="round" />
                                                            <circle cx={ribPointX} cy={ribPointY} r="3.5" fill={cat.color} />

                                                            {/* KOTAK PENYEBAB UTAMA (MAIN CAUSE) */}
                                                            {isHighlighted && <rect x={causeBoxX-3} y={causeBoxY-3} width={causeW+6} height={causeH+6} rx="8" fill="none" stroke="#FBBF24" strokeWidth="3" className="animate-pulse" />}
                                                            <rect x={causeBoxX} y={causeBoxY} width={causeW} height={causeH} rx="5" fill={isHighlighted ? '#FEF9C3' : '#ffffff'} stroke={isHighlighted ? '#F59E0B' : cat.color} strokeWidth="1.8" className="shadow-sm hover:stroke-blue-500 transition" />
                                                            <rect x={causeBoxX} y={causeBoxY} width="4" height={causeH} rx="2" fill={cat.color} />
                                                            {causeLines.map((line, lIdx) => (
                                                                <text key={lIdx} x={causeBoxX + 10} y={causeBoxY + 14 + lIdx * 14} fill="#0f172a" fontSize="10.5" fontFamily="sans-serif" fontWeight="700" className="pointer-events-none">
                                                                    {line}
                                                                </text>
                                                            ))}

                                                            {/* GARIS ANAK TULANG SUB-PENYEBAB (SUB-CAUSE BONE) */}
                                                            <line x1={subOriginX} y1={subOriginY} x2={subTipX} y2={subTipY} stroke="#94A3B8" strokeWidth="2" strokeDasharray="3 2" />
                                                            <circle cx={subOriginX} cy={subOriginY} r="3" fill="#64748B" />

                                                            {/* KOTAK SUB-PENYEBAB (SUB-CAUSE CARD DI UJUNG ANAK TULANG) */}
                                                            <rect x={subBoxX} y={subBoxY} width={subW} height={subH} rx="4" fill="#F8FAFC" stroke="#CBD5E1" strokeWidth="1.2" className="shadow-xs hover:stroke-blue-400 transition" />
                                                            <path d={`M ${subBoxX} ${subBoxY} L ${subBoxX + 3} ${subBoxY} L ${subBoxX + 3} ${subBoxY + subH} L ${subBoxX} ${subBoxY + subH} Z`} fill="#94A3B8" />
                                                            <text x={subBoxX + 8} y={subBoxY + 11} fill={cat.color} fontSize="8" fontWeight="800" letterSpacing="0.04em">↳ SUB-CAUSE:</text>
                                                            {subLines.map((sLine, sIdx) => (
                                                                <text key={sIdx} x={subBoxX + 8} y={subBoxY + 22 + sIdx * 12} fill="#475569" fontSize="9" fontFamily="sans-serif" fontStyle="italic" className="pointer-events-none">
                                                                    {sLine}
                                                                </text>
                                                            ))}

                                                            {/* Handle Resize */}
                                                            <path d={`M ${causeBoxX+causeW-10} ${causeBoxY+causeH} L ${causeBoxX+causeW} ${causeBoxY+causeH} L ${causeBoxX+causeW} ${causeBoxY+causeH-10} Z`} fill="#cbd5e1" className="cursor-nwse-resize no-print hover:fill-blue-500" onPointerDown={(e) => startResize(e, cause.id, cat.id, causeW)} />
                                                            
                                                            {/* Tombol Hapus */}
                                                            <g className="opacity-0 hover:opacity-100 transition no-print cursor-pointer" onPointerDown={e => e.stopPropagation()} onClick={e => handleDeleteCause(cat.id, cIdx, e)}>
                                                                <rect x={causeBoxX+causeW-18} y={causeBoxY-8} width="16" height="16" rx="8" fill="#ef4444" />
                                                                <text x={causeBoxX+causeW-14} y={causeBoxY+4} fill="#fff" fontSize="10" fontWeight="bold">×</text>
                                                            </g>
                                                        </g>
                                                    );
                                                })}

                                                {/* KOTAK NAMA KATEGORI DI UJUNG TULANG UTAMA */}
                                                {(() => {
                                                    const lines = wrapText(cat.name, 18);
                                                    const catW = Math.max(120, Math.max(...lines.map(l => l.length)) * 8 + 40);
                                                    const catH = lines.length * 16 + 16;
                                                    const cBoxX = actualTipX - catW/2, cBoxY = isTop ? actualTipY - catH - 5 : actualTipY + 5;
                                                    
                                                    return (
                                                        <g className="cursor-grab active:cursor-grabbing" onPointerDown={e => startDrag(e, 'cat', cat.id)}>
                                                            <rect x={cBoxX} y={cBoxY} width={catW} height={catH} rx="6" fill="#ffffff" stroke={cat.color} strokeWidth="2.5" className="shadow-sm" />
                                                            {lines.map((l, i) => <text key={i} x={cBoxX + 12} y={cBoxY + 20 + i*16} fill="#0f172a" fontSize="12" fontWeight="bold" fontFamily="sans-serif" className="pointer-events-none">{l}</text>)}
                                                            
                                                            <g className="cursor-pointer hover:opacity-80 no-print" onPointerDown={e=>e.stopPropagation()} onClick={e=>handleAddCause(cat.id, e)}>
                                                                <circle cx={cBoxX+catW-26} cy={cBoxY+catH/2} r="8" fill="#f1f5f9" stroke="#cbd5e1" /><text x={cBoxX+catW-26} y={cBoxY+catH/2+4} textAnchor="middle" fill="#475569" fontSize="12" fontWeight="bold">+</text>
                                                            </g>
                                                            <g className="cursor-pointer hover:opacity-80 no-print" onPointerDown={e=>e.stopPropagation()} onClick={e=>handleDeleteCategory(cat.id, e)}>
                                                                <circle cx={cBoxX+catW-8} cy={cBoxY+catH/2} r="8" fill="#fee2e2" stroke="#fca5a5" /><text x={cBoxX+catW-8} y={cBoxY+catH/2+3} textAnchor="middle" fill="#ef4444" fontSize="10" fontWeight="bold">×</text>
                                                            </g>
                                                        </g>
                                                    );
                                                })()}
                                            </g>
                                        );
                                    });
                                })}

                                {/* KEPALA IKAN / MASALAH UTAMA */}
                                <g className="cursor-grab active:cursor-grabbing" transform={`translate(${(data.problemOffsetX||0)+(tempOffsets['problem']?.dx||0)}, ${(data.problemOffsetY||0)+(tempOffsets['problem']?.dy||0)})`} onPointerDown={e => startDrag(e, 'problem', 'problem')}>
                                    <path d={`M ${SPINE_END_X} ${SPINE_Y - 95} C ${SPINE_END_X + 90} ${SPINE_Y - 95}, ${SPINE_END_X + 170} ${SPINE_Y - 55}, ${SPINE_END_X + 220} ${SPINE_Y} C ${SPINE_END_X + 170} ${SPINE_Y + 55}, ${SPINE_END_X + 90} ${SPINE_Y + 95}, ${SPINE_END_X} ${SPINE_Y + 95} Z`} fill="#ffffff" stroke="#2563eb" strokeWidth="2.5" className="drop-shadow-md" />
                                    <circle cx={SPINE_END_X + 175} cy={SPINE_Y - 35} r="6" fill="#3b82f6" />
                                    
                                    <rect x={SPINE_END_X - 5} y={SPINE_Y - 50} width="170" height="100" rx="8" fill="#f8fafc" stroke="#bfdbfe" strokeWidth="1.5" />
                                    <text x={SPINE_END_X + 10} y={SPINE_Y - 32} fill="#2563eb" fontSize="10" fontWeight="bold" fontFamily="sans-serif" className="pointer-events-none">MASALAH (EFFECT)</text>
                                    {wrapText(data.problem, 20).slice(0,4).map((line, i) => <text key={i} x={SPINE_END_X + 10} y={SPINE_Y - 12 + i*16} fill="#0f172a" fontSize="12" fontWeight="700" fontFamily="sans-serif" className="pointer-events-none">{line}</text>)}
                                </g>
                            </svg>
                        </div>
                    </div>

                    {/* CORRECTIVE ACTION PLAN TABLE */}
                    <div className="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8 table-wrapper bg-slate-50 space-y-6">
                        
                        {data.conclusion && (
                            <div className="bg-white border border-blue-200 rounded-xl p-5 shadow-sm flex items-start gap-4">
                                <div className="p-2.5 bg-blue-50 text-blue-600 rounded-xl shrink-0 mt-0.5">
                                    <FileText className="w-5 h-5" />
                                </div>
                                <div className="flex-1">
                                    <h3 className="text-xs font-bold text-blue-800 uppercase tracking-wider mb-1">Executive Conclusion (Sintesis RCA 6M)</h3>
                                    <textarea 
                                        rows="2"
                                        value={data.conclusion}
                                        onChange={(e) => setData(prev => ({ ...prev, conclusion: e.target.value }))}
                                        className="w-full text-sm text-slate-700 bg-transparent outline-none resize-none font-medium leading-relaxed"
                                        placeholder="Ringkasan eksekutif akar masalah..."
                                    />
                                </div>
                            </div>
                        )}

                        <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                            <div className="px-6 py-4 border-b border-slate-200 flex flex-wrap gap-4 justify-between items-center bg-white">
                                <div>
                                    <h2 className="text-lg font-bold text-[#005073] uppercase tracking-wide">Corrective Action Plan (CAPA)</h2>
                                    <p className="text-xs text-slate-500 mt-0.5">Perubahan di tabel langsung memperbarui diagram tulang di atas secara real-time.</p>
                                </div>
                                <button onClick={() => { if(data.categories.length > 0) handleAddCause(data.categories[0].id); }} className="bg-[#059669] hover:bg-[#047857] text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm no-print">
                                    <Plus className="w-4 h-4" /> Tambah Baris Manual
                                </button>
                            </div>
                            
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left border-collapse">
                                    <thead className="bg-[#005073] text-white">
                                        <tr>
                                            <th className="border-b border-slate-300 p-3 font-semibold w-40">Category</th>
                                            <th className="border-b border-slate-300 p-3 font-semibold w-64">Main Cause (Tulang Cabang)</th>
                                            <th className="border-b border-slate-300 p-3 font-semibold min-w-[280px]">Sub Cause (Anak Tulang)</th>
                                            <th className="border-b border-slate-300 p-3 font-semibold min-w-[280px]">Corrective Action Plan</th>
                                            <th className="border-b border-slate-300 p-3 font-semibold w-28">PIC</th>
                                            <th className="border-b border-slate-300 p-3 font-semibold w-28">Due Date</th>
                                            <th className="border-b border-slate-300 p-3 font-semibold w-12 text-center no-print">Act</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200 bg-white">
                                        {data.categories.length === 0 && (
                                            <tr><td colSpan="7" className="p-6 text-center text-slate-500">Belum ada data. Silakan gunakan AI Generate atau pilih preset 6M.</td></tr>
                                        )}
                                        {data.categories.map((cat) => (
                                            cat.causes.map((cause, idx) => {
                                                const isHighlighted = highlightedCause === cause.id;
                                                return (
                                                    <tr 
                                                        key={cause.id} 
                                                        onClick={() => setHighlightedCause(cause.id)}
                                                        className={`transition-colors cursor-pointer ${isHighlighted ? 'bg-yellow-50/80 ring-1 ring-yellow-400 inset-0' : 'hover:bg-slate-50'}`}
                                                    >
                                                        {idx === 0 && (
                                                            <td rowSpan={cat.causes.length} className="border-r border-slate-200 p-3 align-top bg-slate-50/50">
                                                                <input 
                                                                    value={cat.name} 
                                                                    onChange={(e) => {
                                                                        const val = e.target.value;
                                                                        setData(prev => ({
                                                                            ...prev,
                                                                            categories: prev.categories.map(c => c.id === cat.id ? { ...c, name: val } : c)
                                                                        }));
                                                                    }} 
                                                                    className="w-full bg-transparent font-bold text-slate-700 outline-none focus:border-b border-blue-500" 
                                                                    title="Edit Nama Kategori"
                                                                />
                                                            </td>
                                                        )}
                                                        <td className="p-2 border-r border-slate-200 align-top">
                                                            <textarea 
                                                                rows="3"
                                                                value={cause.text} 
                                                                onChange={(e) => handleTableEdit(cat.id, cause.id, 'text', e.target.value)} 
                                                                className={`w-full bg-transparent outline-none resize-none p-1 rounded font-medium ${isHighlighted ? 'text-yellow-900' : 'text-slate-800'}`} 
                                                                placeholder="Tulis Akar Penyebab..."
                                                            />
                                                        </td>
                                                        <td className="p-2 border-r border-slate-200 align-top">
                                                            <textarea 
                                                                rows="4" 
                                                                value={cause.subCause} 
                                                                onChange={(e) => handleTableEdit(cat.id, cause.id, 'subCause', e.target.value)} 
                                                                className="w-full bg-transparent outline-none resize-y p-1 text-slate-600 leading-relaxed text-xs" 
                                                                placeholder="Mekanisme detail (langsung muncul di anak tulang)..." 
                                                            />
                                                        </td>
                                                        <td className="p-2 border-r border-slate-200 align-top">
                                                            <textarea 
                                                                rows="4" 
                                                                value={cause.actionPlan} 
                                                                onChange={(e) => handleTableEdit(cat.id, cause.id, 'actionPlan', e.target.value)} 
                                                                className="w-full bg-transparent outline-none resize-y p-1 text-slate-700 leading-relaxed text-xs" 
                                                                placeholder="Rencana tindakan perbaikan terukur..." 
                                                            />
                                                        </td>
                                                        <td className="p-2 border-r border-slate-200 align-top">
                                                            <input type="text" value={cause.pic} onChange={(e) => handleTableEdit(cat.id, cause.id, 'pic', e.target.value)} className="w-full bg-transparent outline-none p-1 text-slate-600 text-xs" placeholder="Nama PIC..." />
                                                        </td>
                                                        <td className="p-2 border-r border-slate-200 align-top">
                                                            <input type="date" value={cause.dueDate} onChange={(e) => handleTableEdit(cat.id, cause.id, 'dueDate', e.target.value)} className="w-full bg-transparent outline-none p-1 text-slate-600 text-xs" />
                                                        </td>
                                                        <td className="p-2 text-center align-top no-print">
                                                            <button onClick={(e) => handleDeleteCause(cat.id, idx, e)} className="text-red-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-50 transition" title="Hapus Baris">
                                                                <Trash2 className="w-4 h-4" />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* MODAL EDIT CEPAT DARI DIAGRAM */}
                    {editingItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 no-print">
                            <div className="bg-white border border-slate-200 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
                                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                                    <h3 className="text-sm font-bold text-slate-800 flex items-center gap-2">
                                        <Edit2 className="w-4 h-4 text-blue-600" />
                                        Edit Penyebab & Sub-Cause
                                    </h3>
                                    <button onClick={() => setEditingItem(null)} className="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                                        <X className="w-4 h-4" />
                                    </button>
                                </div>
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs text-slate-500 font-semibold block mb-1">Akar Masalah Utama (Tulang Cabang):</label>
                                        <input 
                                            type="text" 
                                            id="quick-edit-cause"
                                            defaultValue={editingItem.text}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-500 font-semibold block mb-1">Sub-Cause (Anak Tulang):</label>
                                        <textarea 
                                            rows="3" 
                                            id="quick-edit-subcause"
                                            defaultValue={editingItem.subCause}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                                            placeholder="Detail lanjutan akar masalah..."
                                        />
                                    </div>
                                </div>
                                <div className="flex justify-end space-x-2 pt-2">
                                    <button onClick={() => setEditingItem(null)} className="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Batal</button>
                                    <button 
                                        onClick={() => {
                                            const cInput = document.getElementById('quick-edit-cause');
                                            const sInput = document.getElementById('quick-edit-subcause');
                                            if (cInput && sInput) saveQuickEdit(cInput.value, sInput.value);
                                        }} 
                                        className="px-4 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white transition flex items-center space-x-1"
                                    >
                                        <Check className="w-3.5 h-3.5" />
                                        <span>Simpan</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL AI */}
                    {showAIModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 no-print">
                            <div className="bg-white border border-slate-200 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-5">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2"><Wand2 className="w-5 h-5 text-indigo-500" /> AI Deep RCA Generator (6M)</h3>
                                    <button onClick={() => !isGenerating && setShowAIModal(false)} className="text-slate-400 hover:text-slate-700 bg-slate-100 p-1.5 rounded-lg"><X className="w-4 h-4" /></button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-500 block mb-1.5 font-bold">Model AI:</label>
                                        <div className="relative">
                                            <select value={aiModel} onChange={(e) => setAiModel(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-3 pr-8 py-2 text-sm text-slate-800 outline-none focus:border-indigo-500 appearance-none cursor-pointer">
                                                <option value="gemini-3.1-flash-lite">3.1 Flash-Lite (Cepat & Ringan)</option>
                                                <option value="gemini-1.5-flash">1.5 Flash (Standar)</option>
                                                <option value="gemini-1.5-pro">1.5 Pro (Penalaran Kompleks)</option>
                                            </select>
                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400"><ChevronDown className="w-4 h-4" /></div>
                                        </div>
                                    </div>
                                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 text-xs text-blue-800">
                                        <p className="font-semibold mb-1">Target 6 Kategori Penuh (6M):</p>
                                        <div className="flex flex-wrap gap-1">
                                            {data.categories.map(c => (
                                                <span key={c.id} className="bg-white border border-blue-200 px-2 py-0.5 rounded text-[11px] font-medium text-slate-700">
                                                    {c.name}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-500 block mb-1.5 font-bold">Deskripsi Masalah / Laporan Insiden:</label>
                                        <textarea rows="5" value={aiPrompt} onChange={(e) => setAiPrompt(e.target.value)} placeholder="Ketik atau tempel laporan insiden secara lengkap di sini. AI akan menghasilkan 6 kategori 6M lengkap dengan tulang Cause dan anak tulang Sub-Cause..." className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
                                    </div>
                                    {aiError && <div className="text-xs text-red-600 bg-red-50 border border-red-200 px-3 py-2 rounded-lg font-medium">{aiError}</div>}
                                </div>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button onClick={() => setShowAIModal(false)} disabled={isGenerating} className="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition disabled:opacity-50">Batal</button>
                                    <button onClick={handleAIGenerate} disabled={isGenerating || !aiPrompt.trim()} className="px-5 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition flex items-center space-x-2 disabled:opacity-50">
                                        {isGenerating ? <><Loader2 className="w-4 h-4 animate-spin" /><span>Menganalisis 6M...</span></> : <><Bot className="w-4 h-4" /><span>Generate 6M Lengkap</span></>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
