<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Studio - Live RCA Collaboration</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- HTML2Canvas untuk Export PNG Alat Non-SVG (5Whys & FTA) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Import Map for React and Lucide Icons -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import {
            ZoomIn, ZoomOut, RotateCcw, Plus, Download, Printer,
            Sparkles, Info, Layers, ChevronDown, Edit2, Check, X,
            HelpCircle, Eye, EyeOff, Bot, Wand2, Loader2, Trash2, FileText, Move,
            Network, ListEnd, AlignEndHorizontal, Cloud, CloudOff, Users, Share2, Globe, LogOut
        } from 'lucide-react';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDocs, addDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config Setup
        const appId = 'rca-studio-app';
        const firebaseConfig = {
            apiKey: "AIzaSyBpyq-YpbHdyfYdxSsd6F48Ye-paFWv9z8",
            authDomain: "rca-studio.firebaseapp.com",
            projectId: "rca-studio",
            storageBucket: "rca-studio.firebasestorage.app",
            messagingSenderId: "658137241845",
            appId: "1:658137241845:web:73472bc5bbb95df9b38dbc"
        };
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) { console.warn("Firebase initialization skipped or failed.", e); }

        const PRESETS = {
            '6M': {
                name: '6M (Manufaktur & Rekayasa)',
                problem: 'Tingkat Cacat Produk Meningkat 15%',
                conclusion: 'Kegagalan disebabkan oleh keausan mekanis puncher dan variasi material.',
                categories: [
                    { 
                        id: 'cat-1', name: 'Man (Tenaga Kerja)', color: '#2563EB', 
                        causes: [
                            { text: 'Kurang pelatihan berkala', subCause: 'Operator shift malam belum lulus sertifikasi mesin presisi', actionPlan: 'Wajibkan sertifikasi ulang per kuartal dan buat matriks keahlian operator.' }
                        ] 
                    },
                    { 
                        id: 'cat-2', name: 'Machine (Mesin)', color: '#059669', 
                        causes: [
                            { text: 'Presisi hidrolik puncher turun', subCause: 'Seal silinder hidrolik aus akibat suhu oli melebihi 65°C', actionPlan: 'Ganti seal tahan panas dan pasang modul chiller pendingin.' }
                        ] 
                    },
                    { 
                        id: 'cat-3', name: 'Method (Metode)', color: '#D97706', 
                        causes: [
                            { text: 'SOP pemeliharaan usang', subCause: 'Parameter inspeksi cetakan masih mengacu pada mesin tipe lama', actionPlan: 'Revisi Work Instruction dan buat checklist digital.' }
                        ] 
                    },
                    { 
                        id: 'cat-4', name: 'Material (Bahan Baku)', color: '#DB2777', 
                        causes: [
                            { text: 'Ketebalan pelat lewat toleransi', subCause: 'Deviasi bahan supplier ±0.15 mm dari ambang 0.05 mm', actionPlan: 'Perketat kriteria penerimaan material dan terbitkan CAR.' }
                        ] 
                    },
                    { 
                        id: 'cat-5', name: 'Measurement (Pengukuran)', color: '#7C3AED', 
                        causes: [
                            { text: 'Sensor tidak terkalibrasi', subCause: 'Sensor ultrasonik telat kalibrasi 45 hari dan tertutup kabut oli', actionPlan: 'Kalibrasi ulang sensor dan bersihkan lensa optik harian.' }
                        ] 
                    },
                    { 
                        id: 'cat-6', name: 'Milieu / Environment (Lingkungan)', color: '#0891B2', 
                        causes: [
                            { text: 'Kelembapan ruang produksi tinggi', subCause: 'Kelembapan 85% memicu bintik karat mikro pada cetakan cadangan', actionPlan: 'Pasang dehumidifier dan perbaiki ventilasi aktif.' }
                        ] 
                    }
                ]
            }
        };

        const COLOR_PALETTE = ['#2563EB', '#059669', '#D97706', '#DB2777', '#7C3AED', '#0891B2', '#DC2626', '#0D9488'];

        const wrapText = (text, maxChars) => {
            if (!text) return [''];
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            words.forEach((word) => {
                if ((currentLine + word).length > maxChars) {
                    if (currentLine) lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine += word + ' ';
                }
            });
            if (currentLine) lines.push(currentLine.trim());
            return lines.length > 0 ? lines : [''];
        };

        const formatPresetData = (preset) => {
            return {
                ...preset,
                conclusion: preset.conclusion || '',
                problemOffsetX: 0, problemOffsetY: 0,
                categories: preset.categories.map((c, i) => ({
                    ...c,
                    offsetX: 0, offsetY: 0, boneOffsetX: 0, boneOffsetY: 0,
                    causes: c.causes.map((item, j) => {
                        const isObj = typeof item === 'object' && item !== null;
                        return {
                            id: `cause-${i}-${j}-${Date.now()}`,
                            text: isObj ? item.text : item,
                            subCause: isObj ? (item.subCause || '') : '',
                            actionPlan: isObj ? (item.actionPlan || '') : '',
                            pic: isObj ? (item.pic || '') : '',
                            dueDate: isObj ? (item.dueDate || '') : '',
                            offsetX: 0, offsetY: 0, customWidth: null,
                            subOffsetX: 0, subOffsetY: 0, jointOffsetRatio: 0
                        };
                    })
                }))
            };
        };

        const SVG_WIDTH = 1580;
        const SVG_HEIGHT = 880;
        const SPINE_Y = SVG_HEIGHT / 2;
        const SPINE_START_X = 140;
        const SPINE_END_X = 1320;

        function App() {
            // --- LOBBY & PRESENCE STATE ---
            const [userName, setUserName] = useState(() => localStorage.getItem('rca_username') || '');
            const [inRoom, setInRoom] = useState(false);
            const [activeRoomId, setActiveRoomId] = useState(null);
            const [activeRoomName, setActiveRoomName] = useState('');
            const [lobbyRooms, setLobbyRooms] = useState([]);
            const [participants, setParticipants] = useState([]);
            
            // New Room Form
            const [showNewRoomForm, setShowNewRoomForm] = useState(false);
            const [newRoomName, setNewRoomName] = useState('');
            const [newRoomProblem, setNewRoomProblem] = useState('');

            // --- TABS STATE ---
            const [activeTab, setActiveTab] = useState('fishbone'); 

            // --- DATA STATE ---
            const [data, setData] = useState(() => formatPresetData(PRESETS['6M']));
            const [fiveWhys, setFiveWhys] = useState({ problem: "Masalah...", whys: ["Why 1..."], rootCause: "", actionPlan: "" });
            const [ftaData, setFtaData] = useState({ id: 'root', type: 'top', text: 'Top Event', gate: 'OR', children: [] });

            const [zoom, setZoom] = useState(1);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isPanning, setIsPanning] = useState(false);
            const [startPan, setStartPan] = useState({ x: 0, y: 0 });
            
            const [dragItem, setDragItem] = useState(null);
            const [tempOffsets, setTempOffsets] = useState({});
            const [highlightedCause, setHighlightedCause] = useState(null);

            const [isExporting, setIsExporting] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            const [showAIModal, setShowAIModal] = useState(false);
            const [aiPrompt, setAiPrompt] = useState('');
            const [aiModel, setAiModel] = useState(() => localStorage.getItem('gemini_model') || 'gemini-3.1-flash-lite');
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiError, setAiError] = useState('');

            const [user, setUser] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const isRemoteUpdate = useRef(false);

            const containerRef = useRef(null);
            const svgRef = useRef(null);
            const whysRef = useRef(null);
            const ftaRef = useRef(null);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // Inisialisasi Autentikasi Firebase
            useEffect(() => {
                if (!auth) return;
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                    } else {
                        signInAnonymously(auth).catch(e => {
                            console.error("Gagal login anonim:", e);
                            showToast("Gagal terhubung ke Cloud. Cek koneksi Anda.");
                        });
                    }
                });
                return () => unsubscribe();
            }, []);

            // Listener Daftar Ruangan (Untuk Lobby)
            useEffect(() => {
                if (!user || !db || inRoom) return;
                const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'rca_archives');
                const unsub = onSnapshot(collRef, (snapshot) => {
                    const rooms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                    setLobbyRooms(rooms);
                });
                return () => unsub();
            }, [user, inRoom]);

            // Cek URL saat pertama kali load (untuk langsung masuk jika ada nama)
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const sessionId = urlParams.get('session');
                if (sessionId && userName && user) {
                    joinRoom(sessionId, "Ruang Kolaborasi");
                }
            }, [user]); // Only run when user is authenticated

            // --- LOGIKA PRESENCE & HEARTBEAT ---
            useEffect(() => {
                if (!inRoom || !activeRoomId || !user || !userName) return;

                const presenceRef = doc(db, 'artifacts', appId, 'public', 'data', 'rca_archives', activeRoomId, 'presence', user.uid);
                
                const ping = async () => {
                    try { await setDoc(presenceRef, { name: userName, lastActive: Date.now() }, { merge: true }); } 
                    catch(e) { console.error("Presence ping failed", e); }
                };

                ping(); // Initial ping
                const interval = setInterval(ping, 10000); // Ping every 10 seconds

                // Listener untuk melihat siapa saja yang online
                const presenceCollRef = collection(db, 'artifacts', appId, 'public', 'data', 'rca_archives', activeRoomId, 'presence');
                const unsub = onSnapshot(presenceCollRef, (snap) => {
                    const now = Date.now();
                    const activeUsers = [];
                    snap.forEach(d => {
                        const data = d.data();
                        // Filter out users who haven't pinged in 25 seconds
                        if (now - data.lastActive < 25000) {
                            activeUsers.push({ uid: d.id, name: data.name });
                        }
                    });
                    setParticipants(activeUsers);
                });

                return () => {
                    clearInterval(interval);
                    unsub();
                    deleteDoc(presenceRef).catch(()=>{}); // Try to delete on unmount/leave
                };
            }, [inRoom, activeRoomId, user, userName]);

            // Listener Sinkronisasi Data Konten Ruangan
            useEffect(() => {
                if (!user || !activeRoomId || !inRoom) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rca_archives', activeRoomId);
                const unsub = onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const docData = snap.data();
                        setActiveRoomName(docData.name);
                        isRemoteUpdate.current = true; 
                        try {
                            const parsed = JSON.parse(docData.payload);
                            if (parsed.fishbone) setData(parsed.fishbone);
                            if (parsed.fiveWhys) setFiveWhys(parsed.fiveWhys);
                            if (parsed.ftaData) setFtaData(parsed.ftaData);
                        } catch(e) { console.error("Parse error", e); }
                    } else {
                        // Room deleted
                        leaveRoom();
                        showToast("Ruangan telah dihapus.");
                    }
                }, (err) => console.error(err));
                return () => unsub();
            }, [user, activeRoomId, inRoom]);

            // Sync Otomatis Lokal ke Cloud (Debounced)
            useEffect(() => {
                if (!user || !activeRoomId || !inRoom) return;
                if (isRemoteUpdate.current) {
                    isRemoteUpdate.current = false;
                    return;
                }
                const save = async () => {
                    const payload = JSON.stringify({ fishbone: data, fiveWhys, ftaData });
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rca_archives', activeRoomId);
                        await setDoc(docRef, { 
                            name: activeRoomName || 'Ruang RCA',
                            problem: data.problem,
                            payload, 
                            updatedAt: new Date().toISOString() 
                        }, { merge: true });
                    } catch (e) { console.error("Sync error", e); }
                };
                const timeoutId = setTimeout(save, 400);
                return () => clearTimeout(timeoutId);
            }, [data, fiveWhys, ftaData, activeRoomId, inRoom, user, activeRoomName]);

            // --- LOBBY ACTIONS ---
            const joinRoom = (id, name) => {
                if (!userName.trim()) { showToast("Silakan masukkan nama Anda terlebih dahulu."); return; }
                localStorage.setItem('rca_username', userName);
                setActiveRoomId(id);
                setActiveRoomName(name);
                setInRoom(true);
                
                const url = new URL(window.location.href);
                url.searchParams.set('session', id);
                window.history.replaceState(null, '', url.toString());
            };

            const leaveRoom = () => {
                setInRoom(false);
                setActiveRoomId(null);
                const url = new URL(window.location.href);
                url.searchParams.delete('session');
                window.history.replaceState(null, '', url.toString());
            };

            const createNewRoom = async () => {
                if (!userName.trim()) { showToast("Silakan masukkan nama Anda terlebih dahulu."); return; }
                if (!newRoomName.trim()) { showToast("Nama ruang tidak boleh kosong."); return; }
                
                localStorage.setItem('rca_username', userName);
                const initialData = formatPresetData(PRESETS['6M']);
                initialData.problem = newRoomProblem || 'Masalah Baru';
                const payload = JSON.stringify({ fishbone: initialData, fiveWhys, ftaData });

                try {
                    const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'rca_archives');
                    const newDoc = await addDoc(collRef, {
                        name: newRoomName,
                        problem: initialData.problem,
                        payload,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        createdBy: user.uid
                    });
                    
                    setShowNewRoomForm(false);
                    setNewRoomName('');
                    setNewRoomProblem('');
                    joinRoom(newDoc.id, newRoomName);
                } catch(e) {
                    console.error(e);
                    showToast("Gagal membuat ruang. Cek koneksi Anda.");
                }
            };

            const deleteRoom = async (id, e) => {
                e.stopPropagation();
                if (!confirm("Hapus ruangan ini secara permanen?")) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rca_archives', id);
                    await deleteDoc(docRef);
                    showToast("Ruangan dihapus.");
                } catch(e) { console.error(e); }
            };

            const handleShare = async () => {
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = window.location.href; 
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    showToast('Link ruangan disalin! Bagikan ke tim Anda.');
                } catch(e) { console.error('Copy failed', e); }
            };

            // INTERAKSI POINTER UNTUK FISHBONE
            const handlePointerDown = (e) => {
                if (e.target.closest('button') || e.target.closest('.no-pan') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('td') || editingItem) return;
                setIsPanning(true);
                setStartPan({ x: e.clientX - pan.x, y: e.clientY - pan.y });
                setHighlightedCause(null);
            };

            const handlePointerMove = (e) => {
                if (dragItem) {
                    const dx = (e.clientX - dragItem.startX) / zoom;
                    const dy = (e.clientY - dragItem.startY) / zoom;
                    if (dragItem.type === 'resize') {
                        setTempOffsets({ [dragItem.id]: { dw: dx } });
                    } else {
                        setTempOffsets({ [dragItem.id]: { dx, dy } });
                    }
                    return;
                }
                if (isPanning) {
                    setPan({ x: e.clientX - startPan.x, y: e.clientY - startPan.y });
                }
            };

            const handlePointerUp = () => {
                setIsPanning(false);
                if (dragItem) {
                    const offsets = tempOffsets[dragItem.id] || {};
                    setData((prev) => {
                        const next = { ...prev };
                        if (dragItem.type === 'problem') {
                            next.problemOffsetX = (next.problemOffsetX || 0) + (offsets.dx || 0);
                            next.problemOffsetY = (next.problemOffsetY || 0) + (offsets.dy || 0);
                        } else {
                            next.categories = next.categories.map((c) => {
                                if (c.id === dragItem.catId || c.id === dragItem.id) {
                                    const nextCat = { ...c };
                                    if (dragItem.type === 'cat' && dragItem.id === c.id) {
                                        nextCat.offsetX = (nextCat.offsetX || 0) + (offsets.dx || 0);
                                        nextCat.offsetY = (nextCat.offsetY || 0) + (offsets.dy || 0);
                                    }
                                    if (dragItem.type === 'cat_bone' && dragItem.catId === c.id) {
                                        nextCat.boneOffsetX = (nextCat.boneOffsetX || 0) + (offsets.dx || 0);
                                        nextCat.boneOffsetY = (nextCat.boneOffsetY || 0) + (offsets.dy || 0);
                                    }
                                    if (dragItem.catId === c.id) {
                                        nextCat.causes = nextCat.causes.map(cause => {
                                            const isMatchingCause =
                                                (dragItem.type === 'cause' && dragItem.id === cause.id) ||
                                                (dragItem.type === 'cause_joint' && dragItem.id === `joint-${cause.id}`) ||
                                                (dragItem.type === 'subcause' && dragItem.id === `sub-${cause.id}`) ||
                                                (dragItem.type === 'resize' && dragItem.id === `resize-${cause.id}`);

                                            if (isMatchingCause) {
                                                const updatedCause = { ...cause };
                                                if (dragItem.type === 'cause') {
                                                    updatedCause.offsetX = (cause.offsetX || 0) + (offsets.dx || 0);
                                                    updatedCause.offsetY = (cause.offsetY || 0) + (offsets.dy || 0);
                                                }
                                                else if (dragItem.type === 'cause_joint') {
                                                    updatedCause.jointOffsetRatio = (cause.jointOffsetRatio || 0) + (offsets.dy || 0) / 180;
                                                }
                                                else if (dragItem.type === 'subcause') {
                                                    updatedCause.subOffsetX = (cause.subOffsetX || 0) + (offsets.dx || 0);
                                                    updatedCause.subOffsetY = (cause.subOffsetY || 0) + (offsets.dy || 0);
                                                }
                                                else if (dragItem.type === 'resize') {
                                                    updatedCause.customWidth = Math.max(100, (cause.customWidth || dragItem.startWidth) + (offsets.dw || 0));
                                                }
                                                return updatedCause;
                                            }
                                            return cause;
                                        });
                                    }
                                    return nextCat;
                                }
                                return c;
                            });
                        }
                        return next;
                    });
                    setDragItem(null);
                    setTempOffsets({});
                }
            };

            const startDrag = (e, type, id, catId = null, causeId = null) => {
                e.stopPropagation();
                setDragItem({ type, id, catId, causeId, startX: e.clientX, startY: e.clientY });
                if (type === 'cause' || type === 'subcause') setHighlightedCause(causeId || id);
            };

            const startResize = (e, id, catId, currentWidth) => {
                e.stopPropagation();
                setDragItem({ type: 'resize', id: `resize-${id}`, catId, startX: e.clientX, startWidth: currentWidth });
            };

            const handleWheel = (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                    setZoom((z) => Math.min(2.5, Math.max(0.4, z * zoomFactor)));
                }
            };

            // CRUD OPERATIONS FISHBONE
            const handleAddCause = (catId, e) => {
                if (e) e.stopPropagation();
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            return { ...c, causes: [...c.causes, { id: `cause-${Date.now()}`, text: 'Penyebab baru', subCause: 'Rincian sub-cause lanjutan...', actionPlan: '', pic: '', dueDate: '', offsetX: 0, offsetY: 0, subOffsetX: 0, subOffsetY: 0, jointOffsetRatio: 0, customWidth: null }] };
                        }
                        return c;
                    })
                }));
            };

            const handleDeleteCause = (catId, causeIdx, e) => {
                if (e) e.stopPropagation();
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            const nextCauses = [...c.causes];
                            nextCauses.splice(causeIdx, 1);
                            return { ...c, causes: nextCauses };
                        }
                        return c;
                    })
                }));
            };

            const handleTableEdit = (catId, causeId, field, value) => {
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            return {
                                ...c,
                                causes: c.causes.map((cause) => {
                                    if (cause.id === causeId) return { ...cause, [field]: value };
                                    return cause;
                                })
                            };
                        }
                        return c;
                    })
                }));
            };

            const saveQuickEdit = (newText, newSubCause) => {
                if (!editingItem) return;
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === editingItem.catId) {
                            const updatedCauses = [...c.causes];
                            updatedCauses[editingItem.causeIndex] = {
                                ...updatedCauses[editingItem.causeIndex],
                                text: newText.trim() || updatedCauses[editingItem.causeIndex].text,
                                subCause: newSubCause.trim()
                            };
                            return { ...c, causes: updatedCauses };
                        }
                        return c;
                    })
                }));
                setEditingItem(null);
            };

            // CRUD OPERATIONS 5 WHYS
            const updateWhy = (idx, value) => {
                const newWhys = [...fiveWhys.whys]; newWhys[idx] = value;
                setFiveWhys({...fiveWhys, whys: newWhys});
            };
            const addWhy = () => setFiveWhys({...fiveWhys, whys: [...fiveWhys.whys, ""]});
            const removeWhy = (idx) => {
                const newWhys = [...fiveWhys.whys]; newWhys.splice(idx, 1);
                setFiveWhys({...fiveWhys, whys: newWhys});
            };

            // CRUD OPERATIONS FTA
            const updateFTANode = (node, id, field, value) => {
                if (node.id === id) { return { ...node, [field]: value }; }
                if (node.children) { return { ...node, children: node.children.map(c => updateFTANode(c, id, field, value)) }; }
                return node;
            };
            const addChildFTANode = (node, id, type) => {
                if (node.id === id) {
                    const newChild = { id: `n-${Date.now()}`, type, text: type === 'basic' ? 'Basic Event' : 'Intermediate Event', gate: type === 'intermediate' ? 'OR' : undefined, children: type === 'intermediate' ? [] : undefined };
                    return { ...node, children: [...(node.children || []), newChild] };
                }
                if (node.children) { return { ...node, children: node.children.map(c => addChildFTANode(c, id, type)) }; }
                return node;
            };
            const removeFTANode = (node, id) => {
                if (node.children) {
                    const filtered = node.children.filter(c => c.id !== id);
                    return { ...node, children: filtered.map(c => removeFTANode(c, id)) };
                }
                return node;
            };
            
            const handleFTAUpdate = (id, field, value) => setFtaData(updateFTANode(ftaData, id, field, value));
            const handleFTAAddChild = (id, type) => setFtaData(addChildFTANode(ftaData, id, type));
            const handleFTARemove = (id) => setFtaData(removeFTANode(ftaData, id));

            const renderFTANode = (node, isRoot = false) => {
                const textLen = node.text ? node.text.length : 0;
                const lineBreaks = node.text ? (node.text.match(/\n/g) || []).length : 0;
                const calcRows = Math.max(2, lineBreaks + 1, Math.ceil(textLen / 18));

                return (
                    <li key={node.id}>
                        <div className="flex flex-col items-center">
                            <div className="relative group">
                                <div className={`text-center p-3 border-2 shadow-sm relative z-10 transition-colors flex flex-col justify-center items-center ${node.type === 'basic' ? 'w-40 min-h-[9rem] rounded-[3rem] border-red-500 bg-red-50' : 'w-40 md:w-48 min-h-[6rem] rounded-lg border-blue-600 bg-white'}`}>
                                    <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">{node.type}</div>

                                    <div className="relative z-10 cursor-pointer group/gate hover:scale-110 transition-transform no-print" onClick={() => handleFTAUpdate(node.id, 'gate', node.gate === 'AND' ? 'OR' : 'AND')} title="Klik untuk menukar jenis gerbang">

                                        ) : (

                    let parsedData;

                                    };

                        setData(formatPresetData({ name: 'Hasil Analisis AI 6M', problem: parsedData.problem || aiPrompt, conclusion: parsedData.conclusion || 'Analisis telah disusun komprehensif.', categories: mappedCategories }));
                    } else if (activeTab === '5whys') {

                                            <div>
                                                <h2 className="text-2xl font-bold text-slate-800">Pilih Ruang Diskusi</h2>

            return (

                                                            const jointX = actualBaseX + (actualTipX - actualBaseX) * jointRatio + jointDx;

                                                                        <rect x={subBoxX} y={subBoxY} width={subW} height={subH} rx="4" fill="#F8FAFC" stroke="#94A3B8" strokeWidth="1.2" className="shadow-xs hover:stroke-blue-500 hover:shadow-md transition" />
                                                                        <path d={`M ${subBoxX} ${subBoxY} L ${subBoxX + 3.5} ${subBoxY} L ${subBoxX + 3.5} ${subBoxY + subH} L ${subBoxX} ${subBoxY + subH} Z`} fill="#64748B" />
                                                                        <text x={subBoxX + 8} y={subBoxY + 11} fill={cat.color} fontSize="8" fontWeight="800" letterSpacing="0.04em">↳ SUB-CAUSE:</text>
                                                                        {subLines.map((sLine, sIdx) => <text key={sIdx} x={subBoxX + 8} y={subBoxY + 22 + sIdx * 12} fill="#334155" fontSize="9" fontFamily="sans-serif" fontStyle="italic" className="pointer-events-none">{sLine}</text>)}
                                                                    </g>

                                                                    <g className="cursor-grab active:cursor-grabbing group/cause" onPointerDown={(e) => startDrag(e, 'cause', cause.id, cat.id, cause.id)} onDoubleClick={(e) => { e.stopPropagation(); setEditingItem({ catId: cat.id, causeIndex: cIdx, text: cause.text, subCause: cause.subCause || '' }); }}>

                                                                        <rect x={causeBoxX} y={causeBoxY} width="4" height={causeH} rx="2" fill={cat.color} />

                                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                                    <h3 className="text-sm font-bold text-slate-800 flex items-center gap-2"><Edit2 className="w-4 h-4 text-blue-600" />Edit Penyebab</h3>
                                    <button onClick={() => setEditingItem(null)} className="text-slate-400 hover:text-slate-600 p-1 rounded-lg"><X className="w-4 h-4" /></button>
                                </div>
                                <div className="space-y-3">
                                    <div><label className="text-xs text-slate-500 font-semibold block mb-1">Akar Masalah Utama:</label><input type="text" id="quick-edit-cause" defaultValue={editingItem.text} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 outline-none focus:border-blue-500" /></div>
                                    <div><label className="text-xs text-slate-500 font-semibold block mb-1">Sub-Cause (Anak Tulang):</label><textarea rows="3" id="quick-edit-subcause" defaultValue={editingItem.subCause} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 outline-none focus:border-blue-500" /></div>
                                </div>
                                <div className="flex justify-end space-x-2 pt-2">
                                    <button onClick={() => setEditingItem(null)} className="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Batal</button>
                                    <button onClick={() => { const cInput = document.getElementById('quick-edit-cause'); const sInput = document.getElementById('quick-edit-subcause'); if (cInput && sInput) saveQuickEdit(cInput.value, sInput.value); }} className="px-4 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white transition flex items-center space-x-1"><Check className="w-3.5 h-3.5" /><span>Simpan</span></button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL AI (UNIVERSAL) */}
                    {showAIModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 no-print">
                            <div className="bg-white border border-slate-200 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-5">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2"><Wand2 className="w-5 h-5 text-indigo-500" /> AI Generator ({activeTab.toUpperCase()})</h3>
                                    <button onClick={() => !isGenerating && setShowAIModal(false)} className="text-slate-400 hover:text-slate-700 bg-slate-100 p-1.5 rounded-lg"><X className="w-4 h-4" /></button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-500 block mb-1.5 font-bold">Model AI:</label>
                                        <select value={aiModel} onChange={(e) => setAiModel(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 outline-none focus:border-indigo-500">
                                            <option value="gemini-3.1-flash-lite">3.1 Flash-Lite (Cepat & Ringan)</option>
                                            <option value="gemini-1.5-flash">1.5 Flash (Standar)</option>
                                            <option value="gemini-1.5-pro">1.5 Pro (Penalaran Kompleks)</option>
                                        </select>
                                    </div>
                                    <div><label className="text-xs text-slate-500 block mb-1.5 font-bold">Deskripsi Masalah / Laporan Insiden:</label><textarea rows="4" value={aiPrompt} onChange={(e) => setAiPrompt(e.target.value)} placeholder="Ketik atau tempel laporan insiden secara lengkap..." className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" /></div>
                                    {aiError && <div className="text-xs text-red-600 bg-red-50 border border-red-200 px-3 py-2 rounded-lg font-medium">{aiError}</div>}
                                </div>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button onClick={() => setShowAIModal(false)} disabled={isGenerating} className="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition disabled:opacity-50">Batal</button>
                                    <button onClick={handleAIGenerate} disabled={isGenerating || !aiPrompt.trim()} className="px-5 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition flex items-center space-x-2 disabled:opacity-50"><Bot className="w-4 h-4" /><span>Generate</span></button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMsg && (
                        <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl font-semibold text-sm flex items-center gap-2">
                            <Check className="w-4 h-4 text-green-400" /> {toastMsg}
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
