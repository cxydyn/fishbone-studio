<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Studio - 6M Independent Draggable Bones</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for React and Lucide Icons -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import {
            ZoomIn, ZoomOut, RotateCcw, Plus, Download, Printer,
            Sparkles, Info, Layers, ChevronDown, Edit2, Check, X,
            HelpCircle, Eye, EyeOff, Bot, Wand2, Loader2, Trash2, FileText, Move
        } from 'lucide-react';

        // PRESET LENGKAP 6M (3 ATAS, 3 BAWAH)
        const PRESETS = {
            '6M': {
                name: '6M (Manufaktur & Rekayasa)',
                problem: 'Tingkat Cacat Produk Meningkat 15%',
                conclusion: 'Kegagalan disebabkan oleh keausan mekanis puncher dan variasi ketebalan material yang tidak terdeteksi akibat sensor in-line telat dikalibrasi.',
                categories: [
                    { 
                        id: 'cat-1', name: 'Man (Tenaga Kerja)', color: '#2563EB', 
                        causes: [
                            { 
                                text: 'Kurang pelatihan berkala', 
                                subCause: 'Operator shift malam belum lulus sertifikasi mesin presisi', 
                                actionPlan: 'Wajibkan sertifikasi ulang per kuartal dan buat matriks keahlian operator.' 
                            },
                            { 
                                text: 'Kelelahan operator shift 3', 
                                subCause: 'Lembur berturut-turut melebihi batas 14 jam per minggu', 
                                actionPlan: 'Batasi lembur maksimal 2 hari berturut-turut.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-2', name: 'Machine (Mesin)', color: '#059669', 
                        causes: [
                            { 
                                text: 'Presisi hidrolik puncher turun', 
                                subCause: 'Seal silinder hidrolik aus akibat suhu oli melebihi 65°C', 
                                actionPlan: 'Ganti seal tahan panas dan pasang modul chiller pendingin.' 
                            },
                            { 
                                text: 'Keausan guide pin die block', 
                                subCause: 'Clearance guide pin melebihi batas toleransi 0.08 mm', 
                                actionPlan: 'Ganti guide pin baru dan lakukan flushing lubrikasi.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-3', name: 'Method (Metode)', color: '#D97706', 
                        causes: [
                            { 
                                text: 'SOP pemeliharaan usang', 
                                subCause: 'Parameter inspeksi cetakan masih mengacu pada mesin tipe lama', 
                                actionPlan: 'Revisi Work Instruction dan buat checklist digital.' 
                            },
                            { 
                                text: 'Prosedur setup tidak standar', 
                                subCause: 'Teknisi mengencangkan clamping tanpa kunci torsi', 
                                actionPlan: 'Wajibkan kunci torsi terkalibrasi dan pasang visual board.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-4', name: 'Material (Bahan Baku)', color: '#DB2777', 
                        causes: [
                            { 
                                text: 'Ketebalan pelat lewat toleransi', 
                                subCause: 'Deviasi bahan supplier ±0.15 mm dari ambang 0.05 mm', 
                                actionPlan: 'Perketat kriteria penerimaan material dan terbitkan CAR.' 
                            },
                            { 
                                text: 'Residu anti-karat berlebih', 
                                subCause: 'Oli pelindung terlalu kental menjebak gram sisa potong', 
                                actionPlan: 'Standarkan viskositas oli dan pasang air blow cleaner.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-5', name: 'Measurement (Pengukuran)', color: '#7C3AED', 
                        causes: [
                            { 
                                text: 'Sensor tidak terkalibrasi', 
                                subCause: 'Sensor ultrasonik telat kalibrasi 45 hari dan tertutup kabut oli', 
                                actionPlan: 'Kalibrasi ulang sensor dan bersihkan lensa optik harian.' 
                            },
                            { 
                                text: 'Metode sampling QC minim', 
                                subCause: 'Pemeriksaan hanya pada 5 part awal setiap pergantian coil', 
                                actionPlan: 'Terapkan SPC sampling berkala per 500 stroke.' 
                            }
                        ] 
                    },
                    { 
                        id: 'cat-6', name: 'Milieu / Environment (Lingkungan)', color: '#0891B2', 
                        causes: [
                            { 
                                text: 'Kelembapan ruang produksi tinggi', 
                                subCause: 'Kelembapan 85% memicu bintik karat mikro pada cetakan cadangan', 
                                actionPlan: 'Pasang dehumidifier dan perbaiki ventilasi aktif.' 
                            },
                            { 
                                text: 'Akumulasi debu abrasif', 
                                subCause: 'Partisi area gerinda dan stamping presisi hanya tirai plastik', 
                                actionPlan: 'Bangun partisi panel sandwich kedap debu.' 
                            }
                        ] 
                    }
                ]
            },
            '4P': {
                name: '4P (Pemasaran & Layanan)',
                problem: 'Konversi Penjualan Kuartal Ini Menurun',
                conclusion: 'Penurunan konversi disebabkan oleh kendala performa teknis di checkout mobile serta struktur harga yang kalah kompetitif.',
                categories: [
                    { id: 'cat-1', name: 'Product (Produk)', color: '#2563EB', causes: [{ text: 'Fitur baru membingungkan', subCause: 'Navigasi diubah tanpa tutorial onboarding bertahap', actionPlan: 'Rilis interactive product tour 3 langkah.' }] },
                    { id: 'cat-2', name: 'Price (Harga)', color: '#059669', causes: [{ text: 'Struktur harga kurang kompetitif', subCause: 'Kompetitor meluncurkan diskon 40% skema tahunan', actionPlan: 'Luncurkan paket bundling tahunan fleksibel.' }] },
                    { id: 'cat-3', name: 'Place (Saluran)', color: '#D97706', causes: [{ text: 'Latency tinggi checkout mobile', subCause: 'Payment gateway sering timeout > 8 detik di jam sibuk', actionPlan: 'Gunakan multi-gateway auto-routing.' }] },
                    { id: 'cat-4', name: 'Promotion (Promosi)', color: '#DB2777', causes: [{ text: 'Targeting iklan meleset', subCause: 'Data demografi audiens belum diperbarui pasca update OS', actionPlan: 'Gunakan Conversion API sisi server.' }] }
                ]
            }
        };

        const COLOR_PALETTE = ['#2563EB', '#059669', '#D97706', '#DB2777', '#7C3AED', '#0891B2', '#DC2626', '#0D9488'];

        const wrapText = (text, maxChars) => {
            if (!text) return [''];
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            words.forEach((word) => {
                if ((currentLine + word).length > maxChars) {
                    if (currentLine) lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine += word + ' ';
                }
            });
            if (currentLine) lines.push(currentLine.trim());
            return lines.length > 0 ? lines : [''];
        };

        const formatPresetData = (preset) => {
            return {
                ...preset,
                conclusion: preset.conclusion || '',
                problemOffsetX: 0, problemOffsetY: 0,
                categories: preset.categories.map((c, i) => ({
                    ...c,
                    offsetX: 0, offsetY: 0, boneOffsetX: 0, boneOffsetY: 0,
                    causes: c.causes.map((item, j) => {
                        const isObj = typeof item === 'object' && item !== null;
                        return {
                            id: `cause-${i}-${j}-${Date.now()}`,
                            text: isObj ? item.text : item,
                            subCause: isObj ? (item.subCause || '') : '',
                            actionPlan: isObj ? (item.actionPlan || '') : '',
                            pic: isObj ? (item.pic || '') : '',
                            dueDate: isObj ? (item.dueDate || '') : '',
                            offsetX: 0, offsetY: 0, customWidth: null,
                            subOffsetX: 0, subOffsetY: 0, jointOffsetRatio: 0
                        };
                    })
                }))
            };
        };

        const SVG_WIDTH = 1580;
        const SVG_HEIGHT = 880;
        const SPINE_Y = SVG_HEIGHT / 2;
        const SPINE_START_X = 140;
        const SPINE_END_X = 1320;

        function App() {
            // Anti-cache: v13_isolated_drag memastikan 6M selalu termuat secara default
            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem('fishbone_diagram_data_v13_isolated_drag');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.categories && parsed.categories.length >= 6) return parsed;
                    }
                } catch (e) {}
                return formatPresetData(PRESETS['6M']);
            });

            const [activePreset, setActivePreset] = useState('6M');
            const [zoom, setZoom] = useState(1);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isPanning, setIsPanning] = useState(false);
            const [startPan, setStartPan] = useState({ x: 0, y: 0 });
            
            // Drag and Drop States
            const [dragItem, setDragItem] = useState(null); // { type, id, catId, causeId, startX, startY, startWidth }
            const [tempOffsets, setTempOffsets] = useState({});
            const [highlightedCause, setHighlightedCause] = useState(null);

            const [showPresetsMenu, setShowPresetsMenu] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            // AI State
            const [showAIModal, setShowAIModal] = useState(false);
            const [aiPrompt, setAiPrompt] = useState('');
            const [aiModel, setAiModel] = useState(() => localStorage.getItem('gemini_model') || 'gemini-3.1-flash-lite');
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiError, setAiError] = useState('');

            const containerRef = useRef(null);
            const svgRef = useRef(null);

            useEffect(() => {
                try { localStorage.setItem('fishbone_diagram_data_v13_isolated_drag', JSON.stringify(data)); } catch (e) {}
            }, [data]);

            // SISTEM POINTER UNTUK MENGGESER TULANG SECARA INDEPENDEN
            const handlePointerDown = (e) => {
                if (e.target.closest('button') || e.target.closest('.no-pan') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('td') || editingItem) return;
                setIsPanning(true);
                setStartPan({ x: e.clientX - pan.x, y: e.clientY - pan.y });
                setHighlightedCause(null);
            };

            const handlePointerMove = (e) => {
                if (dragItem) {
                    const dx = (e.clientX - dragItem.startX) / zoom;
                    const dy = (e.clientY - dragItem.startY) / zoom;
                    if (dragItem.type === 'resize') {
                        setTempOffsets({ [dragItem.id]: { dw: dx } });
                    } else {
                        setTempOffsets({ [dragItem.id]: { dx, dy } });
                    }
                    return;
                }
                if (isPanning) {
                    setPan({ x: e.clientX - startPan.x, y: e.clientY - startPan.y });
                }
            };

            const handlePointerUp = () => {
                setIsPanning(false);
                if (dragItem) {
                    const offsets = tempOffsets[dragItem.id] || {};
                    setData((prev) => {
                        const next = { ...prev };
                        if (dragItem.type === 'problem') {
                            next.problemOffsetX = (next.problemOffsetX || 0) + (offsets.dx || 0);
                            next.problemOffsetY = (next.problemOffsetY || 0) + (offsets.dy || 0);
                        } else {
                            next.categories = next.categories.map((c) => {
                                if (c.id === dragItem.catId || c.id === dragItem.id) {
                                    const nextCat = { ...c };
                                    
                                    // 1. Geser ujung tulang kategori
                                    if (dragItem.type === 'cat' && dragItem.id === c.id) {
                                        nextCat.offsetX = (nextCat.offsetX || 0) + (offsets.dx || 0);
                                        nextCat.offsetY = (nextCat.offsetY || 0) + (offsets.dy || 0);
                                    }
                                    
                                    // 2. Geser pangkal tulang kategori di spine
                                    if (dragItem.type === 'cat_bone' && dragItem.catId === c.id) {
                                        nextCat.boneOffsetX = (nextCat.boneOffsetX || 0) + (offsets.dx || 0);
                                        nextCat.boneOffsetY = (nextCat.boneOffsetY || 0) + (offsets.dy || 0);
                                    }
                                    
                                    // 3. Geser Cause atau Sub-cause SECARA TERISOLASI
                                    if (dragItem.catId === c.id) {
                                        nextCat.causes = nextCat.causes.map(cause => {
                                            const isMatchingCause =
                                                (dragItem.type === 'cause' && dragItem.id === cause.id) ||
                                                (dragItem.type === 'cause_joint' && dragItem.id === `joint-${cause.id}`) ||
                                                (dragItem.type === 'subcause' && dragItem.id === `sub-${cause.id}`) ||
                                                (dragItem.type === 'resize' && dragItem.id === `resize-${cause.id}`);

                                            if (isMatchingCause) {
                                                const updatedCause = { ...cause };
                                                
                                                // Hanya Cause yang berpindah (Sub-cause tetap di tempatnya)
                                                if (dragItem.type === 'cause') {
                                                    updatedCause.offsetX = (cause.offsetX || 0) + (offsets.dx || 0);
                                                    updatedCause.offsetY = (cause.offsetY || 0) + (offsets.dy || 0);
                                                }
                                                
                                                // Hanya Persendian yang bergeser di tulang
                                                else if (dragItem.type === 'cause_joint') {
                                                    updatedCause.jointOffsetRatio = (cause.jointOffsetRatio || 0) + (offsets.dy || 0) / 180;
                                                }
                                                
                                                // Hanya Sub-cause yang berpindah (Cause tetap diam di tempat)
                                                else if (dragItem.type === 'subcause') {
                                                    updatedCause.subOffsetX = (cause.subOffsetX || 0) + (offsets.dx || 0);
                                                    updatedCause.subOffsetY = (cause.subOffsetY || 0) + (offsets.dy || 0);
                                                }
                                                
                                                // Resize
                                                else if (dragItem.type === 'resize') {
                                                    updatedCause.customWidth = Math.max(100, (cause.customWidth || dragItem.startWidth) + (offsets.dw || 0));
                                                }
                                                
                                                return updatedCause;
                                            }
                                            return cause;
                                        });
                                    }
                                    return nextCat;
                                }
                                return c;
                            });
                        }
                        return next;
                    });
                    setDragItem(null);
                    setTempOffsets({});
                }
            };

            const startDrag = (e, type, id, catId = null, causeId = null) => {
                e.stopPropagation();
                setDragItem({ type, id, catId, causeId, startX: e.clientX, startY: e.clientY });
                if (type === 'cause' || type === 'subcause') {
                    setHighlightedCause(causeId || id);
                }
            };

            const startResize = (e, id, catId, currentWidth) => {
                e.stopPropagation();
                setDragItem({ type: 'resize', id: `resize-${id}`, catId, startX: e.clientX, startWidth: currentWidth });
            };

            const handleWheel = (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                    setZoom((z) => Math.min(2.5, Math.max(0.4, z * zoomFactor)));
                }
            };

            // CRUD OPERATIONS
            const handleAddCategory = () => {
                const newId = `cat-${Date.now()}`;
                const nextColor = COLOR_PALETTE[data.categories.length % COLOR_PALETTE.length];
                setData((prev) => ({
                    ...prev,
                    categories: [...prev.categories, { id: newId, name: `Kategori Baru ${data.categories.length + 1}`, color: nextColor, offsetX: 0, offsetY: 0, causes: [{ id: `cause-${Date.now()}`, text: 'Penyebab Baru', subCause: 'Rincian sub-cause baru', actionPlan: '', pic: '', dueDate: '', offsetX: 0, offsetY: 0, subOffsetX: 0, subOffsetY: 0, jointOffsetRatio: 0, customWidth: null }] }]
                }));
            };

            const handleDeleteCategory = (catId, e) => {
                if (e) e.stopPropagation();
                if (data.categories.length <= 1) return;
                setData((prev) => ({ ...prev, categories: prev.categories.filter((c) => c.id !== catId) }));
            };

            const handleAddCause = (catId, e) => {
                if (e) e.stopPropagation();
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            return { ...c, causes: [...c.causes, { id: `cause-${Date.now()}`, text: 'Penyebab baru', subCause: 'Rincian sub-cause lanjutan...', actionPlan: '', pic: '', dueDate: '', offsetX: 0, offsetY: 0, subOffsetX: 0, subOffsetY: 0, jointOffsetRatio: 0, customWidth: null }] };
                        }
                        return c;
                    })
                }));
            };

            const handleDeleteCause = (catId, causeIdx, e) => {
                if (e) e.stopPropagation();
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            const nextCauses = [...c.causes];
                            nextCauses.splice(causeIdx, 1);
                            return { ...c, causes: nextCauses };
                        }
                        return c;
                    })
                }));
            };

            const handleTableEdit = (catId, causeId, field, value) => {
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === catId) {
                            return {
                                ...c,
                                causes: c.causes.map((cause) => {
                                    if (cause.id === causeId) return { ...cause, [field]: value };
                                    return cause;
                                })
                            };
                        }
                        return c;
                    })
                }));
            };

            const saveQuickEdit = (newText, newSubCause) => {
                if (!editingItem) return;
                setData((prev) => ({
                    ...prev,
                    categories: prev.categories.map((c) => {
                        if (c.id === editingItem.catId) {
                            const updatedCauses = [...c.causes];
                            updatedCauses[editingItem.causeIndex] = {
                                ...updatedCauses[editingItem.causeIndex],
                                text: newText.trim() || updatedCauses[editingItem.causeIndex].text,
                                subCause: newSubCause.trim()
                            };
                            return { ...c, causes: updatedCauses };
                        }
                        return c;
                    })
                }));
                setEditingItem(null);
            };

            // AI GENERATE PERMANEN 6 KATEGORI (6M)
            const handleAIGenerate = async () => {
                if (!aiPrompt.trim()) return setAiError("Deskripsi masalah wajib diisi.");
                setIsGenerating(true);
                setAiError('');
                localStorage.setItem('gemini_model', aiModel);

                // Selalu kunci 6 kategori jika template 6M aktif
                const expectedCategories = activePreset === '4P'
                    ? PRESETS['4P'].categories.map(c => c.name)
                    : PRESETS['6M'].categories.map(c => c.name);

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: aiPrompt,
                            model: aiModel,
                            expectedCategories: expectedCategories
                        })
                    });

                    const resJson = await response.json();
                    if (!response.ok) throw new Error(resJson.error || 'Gagal memproses data melalui server.');

                    let parsedData;
                    try {
                        parsedData = JSON.parse(resJson.result);
                    } catch (e) {
                        parsedData = JSON.parse(resJson.result.replace(/```json/gi, '').replace(/```/gi, '').trim());
                    }

                    const mappedCategories = (parsedData.categories || []).map((cat, i) => {
                        const existingColor = PRESETS['6M'].categories[i]?.color || COLOR_PALETTE[i % COLOR_PALETTE.length];
                        return {
                            id: `cat-ai-${Date.now()}-${i}`,
                            name: cat.name || PRESETS['6M'].categories[i]?.name || `Kategori ${i + 1}`,
                            color: existingColor,
                            causes: (cat.causes || []).map((item, j) => {
                                const isObj = typeof item === 'object' && item !== null;
                                return {
                                    id: `c-${Date.now()}-${i}-${j}`,
                                    text: isObj ? (item.text || 'Penyebab') : item,
                                    subCause: isObj ? (item.subCause || '') : '',
                                    actionPlan: isObj ? (item.actionPlan || '') : '',
                                    pic: '',
                                    dueDate: '',
                                    offsetX: 0, offsetY: 0, subOffsetX: 0, subOffsetY: 0, jointOffsetRatio: 0
                                };
                            })
                        };
                    });

                    setData(formatPresetData({
                        name: 'Hasil Analisis 6M Lengkap',
                        problem: parsedData.problem || aiPrompt,
                        conclusion: parsedData.conclusion || 'Analisis 6M telah disusun secara komprehensif.',
                        categories: mappedCategories
                    }));

                    setShowAIModal(false);
                    setAiPrompt('');
                    setZoom(1);
                    setPan({ x: 0, y: 0 });
                } catch (err) {
                    setAiError(err.message);
                } finally {
                    setIsGenerating(false);
                }
            };

            const exportPNG = () => {
                if (!svgRef.current) return;
                setIsExporting(true);
                try {
                    const svgElement = svgRef.current.cloneNode(true);
                    svgElement.querySelectorAll('.no-print').forEach(el => el.remove());
                    svgElement.querySelectorAll('.canvas-outer-bg').forEach(el => { 
                        el.setAttribute('fill', '#ffffff'); 
                        el.setAttribute('stroke', '#e2e8f0'); 
                    });
                    
                    const svgBlob = new Blob([new XMLSerializer().serializeToString(svgElement)], { type: 'image/svg+xml;charset=utf-8' });
                    const blobURL = URL.createObjectURL(svgBlob);
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = SVG_WIDTH * 2; canvas.height = SVG_HEIGHT * 2;
                        const ctx = canvas.getContext('2d'); ctx.scale(2, 2);
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, SVG_WIDTH, SVG_HEIGHT);
                        ctx.drawImage(img, 0, 0, SVG_WIDTH, SVG_HEIGHT);
                        const link = document.createElement('a'); 
                        link.download = `Fishbone-6M-Bones-${Date.now()}.png`;
                        link.href = canvas.toDataURL('image/png'); 
                        link.click();
                        URL.revokeObjectURL(blobURL); 
                        setIsExporting(false);
                    };
                    img.src = blobURL;
                } catch(e) { 
                    setIsExporting(false); 
                }
            };

            // 6 KATEGORI PENUH: 3 DI ATAS (Genap), 3 DI BAWAH (Ganjil)
            const topCategories = data.categories.filter((_, idx) => idx % 2 === 0);
            const bottomCategories = data.categories.filter((_, idx) => idx % 2 !== 0);

            const getRibMetrics = (index, total, isTop) => {
                const availableLength = SPINE_END_X - SPINE_START_X - 60;
                const step = total > 1 ? availableLength / total : availableLength / 2;
                const baseX = SPINE_START_X + 60 + index * step + step * 0.45;
                const ribLength = 300;
                const dx = Math.cos(Math.PI / 3) * ribLength; // 60 derajat
                const dy = Math.sin(Math.PI / 3) * ribLength;
                return { 
                    baseX, 
                    baseY: SPINE_Y, 
                    tipX: baseX - dx, 
                    tipY: isTop ? SPINE_Y - dy : SPINE_Y + dy 
                };
            };

            return (
                <div className="flex flex-col min-h-screen bg-slate-100">
                    <style>{`
                        @media print {
                            @page { size: A4 landscape; margin: 8mm; }
                            body { background: white !important; }
                            header, .no-print, #canvas-bg { display: none !important; }
                            .print-wrapper { height: auto !important; overflow: visible !important; display: block !important; }
                            .diagram-scalable-wrapper { transform: scale(0.58) !important; transform-origin: top left !important; margin-bottom: 20px;}
                            .table-wrapper { page-break-inside: avoid; }
                        }
                        ::-webkit-scrollbar { width: 8px; height: 8px; }
                        ::-webkit-scrollbar-track { background: #f1f5f9; }
                        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
                        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
                    `}</style>

                    {/* HEADER */}
