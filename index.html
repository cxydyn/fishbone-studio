<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Studio - Live RCA Collaboration</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- HTML2Canvas & SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- html2pdf bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Import Map for React and Lucide Icons -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import {
            ZoomIn, ZoomOut, RotateCcw, Plus, Download, Printer,
            Sparkles, Info, Layers, ChevronDown, Edit2, Check, X,
            HelpCircle, Eye, EyeOff, Bot, Wand2, Loader2, Trash2, FileText, Move,
            Network, ListEnd, AlignEndHorizontal, Cloud, CloudOff, Users, Share2, Globe, LogOut, CheckCircle2, XCircle,
            FileSpreadsheet, FileDown, Image as ImageIcon
        } from 'lucide-react';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDocs, addDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config Setup
        const appId = 'rca-studio-app';
        const firebaseConfig = {
            apiKey: "AIzaSyBpyq-YpbHdyfYdxSsd6F48Ye-paFWv9z8",
            authDomain: "rca-studio.firebaseapp.com",
            projectId: "rca-studio",
            storageBucket: "rca-studio.firebasestorage.app",
            messagingSenderId: "658137241845",
            appId: "1:658137241845:web:73472bc5bbb95df9b38dbc"
        };
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) { console.warn("Firebase initialization skipped or failed.", e); }

        const PRESETS = {
            '6M': {
                name: '6M (Manufaktur & Rekayasa)',
                problem: 'Tingkat Cacat Produk Meningkat 15%',
                conclusion: 'Kegagalan disebabkan oleh keausan mekanis puncher dan variasi material.',
                categories: [
                    { 
                        id: 'cat-1', name: 'Man (Tenaga Kerja)', color: '#2563EB', 
                        causes: [
                            { text: 'Kurang pelatihan berkala', subCause: 'Operator shift malam belum lulus sertifikasi mesin presisi', actionPlan: 'Wajibkan sertifikasi ulang per kuartal.', validity: 'valid' },
                            { text: 'Sengaja melanggar prosedur', subCause: 'Operator sengaja mematikan sensor', actionPlan: 'Beri SP3.', validity: 'invalid' }
                        ] 
                    },
                    { id: 'cat-2', name: 'Machine (Mesin)', color: '#059669', causes: [{ text: 'Presisi hidrolik puncher turun', subCause: 'Seal silinder hidrolik aus akibat suhu oli melebihi 65°C', actionPlan: 'Ganti seal tahan panas.', validity: 'pending' }] },
                    { id: 'cat-3', name: 'Method (Metode)', color: '#D97706', causes: [{ text: 'SOP pemeliharaan usang', subCause: 'Parameter inspeksi cetakan masih mengacu pada mesin tipe lama', actionPlan: 'Revisi Work Instruction dan buat checklist digital.', validity: 'pending' }] },
                    { id: 'cat-4', name: 'Material (Bahan Baku)', color: '#DB2777', causes: [{ text: 'Ketebalan pelat lewat toleransi', subCause: 'Deviasi bahan supplier ±0.15 mm dari ambang 0.05 mm', actionPlan: 'Perketat kriteria penerimaan material.', validity: 'pending' }] },
                    { id: 'cat-5', name: 'Measurement (Pengukuran)', color: '#7C3AED', causes: [{ text: 'Sensor tidak terkalibrasi', subCause: 'Sensor ultrasonik telat kalibrasi 45 hari', actionPlan: 'Kalibrasi ulang sensor.', validity: 'pending' }] },
                    { id: 'cat-6', name: 'Milieu / Environment (Lingkungan)', color: '#0891B2', causes: [{ text: 'Kelembapan ruang produksi tinggi', subCause: 'Kelembapan 85% memicu karat mikro', actionPlan: 'Pasang dehumidifier.', validity: 'pending' }] }
                ]
            }
        };

        const COLOR_PALETTE = ['#2563EB', '#059669', '#D97706', '#DB2777', '#7C3AED', '#0891B2', '#DC2626', '#0D9488'];

        const wrapText = (text, maxChars) => {
            if (!text) return [''];
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            words.forEach((word) => {
                if ((currentLine + word).length > maxChars) {
                    if (currentLine) lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine += word + ' ';
                }
            });
            if (currentLine) lines.push(currentLine.trim());
            return lines.length > 0 ? lines : [''];
        };

        const formatPresetData = (preset) => {
            return {
                ...preset,
                conclusion: preset.conclusion || '',
                problemOffsetX: 0, problemOffsetY: 0,
                categories: preset.categories.map((c, i) => ({
                    ...c,
                    offsetX: 0, offsetY: 0, boneOffsetX: 0, boneOffsetY: 0,
                    causes: c.causes.map((item, j) => {
                        const isObj = typeof item === 'object' && item !== null;
                        return {
                            id: `cause-${i}-${j}-${Date.now()}`,
                            text: isObj ? item.text : item,
                            subCause: isObj ? (item.subCause || '') : '',
                            actionPlan: isObj ? (item.actionPlan || '') : '',
                            validity: isObj ? (item.validity || 'pending') : 'pending',
                            pic: isObj ? (item.pic || '') : '',
                            dueDate: isObj ? (item.dueDate || '') : '',
                            offsetX: 0, offsetY: 0, customWidth: null,
                            subOffsetX: 0, subOffsetY: 0, jointOffsetRatio: 0
                        };
                    })
                }))
            };
        };

        const SVG_WIDTH = 1580;
        const SVG_HEIGHT = 880;
        const SPINE_Y = SVG_HEIGHT / 2;
        const SPINE_START_X = 140;
        const SPINE_END_X = 1320;

        function App() {
            // --- STATE ---
            const [userName, setUserName] = useState(() => localStorage.getItem('rca_username') || '');
            const [inRoom, setInRoom] = useState(false);
            const [activeRoomId, setActiveRoomId] = useState(null);
            const [activeRoomName, setActiveRoomName] = useState('');
            const [lobbyRooms, setLobbyRooms] = useState([]);
            const [participants, setParticipants] = useState([]);
            
            const [showNewRoomForm, setShowNewRoomForm] = useState(false);
            const [newRoomName, setNewRoomName] = useState('');
            const [newRoomProblem, setNewRoomProblem] = useState('');

            const [activeTab, setActiveTab] = useState('fishbone'); 
            const [data, setData] = useState(() => formatPresetData(PRESETS['6M']));
            const [fiveWhys, setFiveWhys] = useState({ problem: "Masalah...", whys: ["Why 1..."], rootCause: "", actionPlan: "" });
            const [ftaData, setFtaData] = useState({ id: 'root', type: 'top', text: 'Top Event', gate: 'OR', validity: 'pending', children: [] });

            const [zoom, setZoom] = useState(1);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isPanning, setIsPanning] = useState(false);
            const [startPan, setStartPan] = useState({ x: 0, y: 0 });
            
            const [dragItem, setDragItem] = useState(null);
            const [tempOffsets, setTempOffsets] = useState({});
            const [highlightedCause, setHighlightedCause] = useState(null);
            const [svgCursor, setSvgCursor] = useState({ x: 0, y: 0, screenX: 0, screenY: 0 });

            const [isExporting, setIsExporting] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            const [showAIModal, setShowAIModal] = useState(false);
            const [aiPrompt, setAiPrompt] = useState('');
            const [aiAdditionalFacts, setAiAdditionalFacts] = useState('');
            const [aiModel, setAiModel] = useState(() => localStorage.getItem('gemini_model') || 'gemini-3.1-flash-lite');
            const [customAiModel, setCustomAiModel] = useState(() => localStorage.getItem('gemini_custom_model') || '');
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiError, setAiError] = useState('');

            const [user, setUser] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const isRemoteUpdate = useRef(false);

            const mainContentRef = useRef(null);
            const containerRef = useRef(null);
            const svgRef = useRef(null);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // --- FIREBASE LOGIC ---
            useEffect(() => {
                if (!auth) return;
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser) setUser(currentUser);
                    else signInAnonymously(auth).catch(e => { console.error(e); showToast("Gagal terhubung ke Cloud."); });
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !db || inRoom) return;
                const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'rca_archives');
                const unsub = onSnapshot(collRef, (snapshot) => {
                    const rooms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                    setLobbyRooms(rooms);
                });
                return () => unsub();
            }, [user, inRoom]);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const sessionId = urlParams.get('session');
                if (sessionId && userName && user) joinRoom(sessionId, "Ruang Kolaborasi");
            }, [user]);

            useEffect(() => {
                if (!inRoom || !activeRoomId || !user || !userName) return;
                const presenceRef = doc(db, 'artifacts', appId, 'public', 'data', 'rca_archives', activeRoomId, 'presence', user.uid);
                const ping = async () => { try { await setDoc(presenceRef, { name: userName, lastActive: Date.now() }, { merge: true }); } catch(e) {} };
                ping(); 
                const interval = setInterval(ping, 10000); 

                const presenceCollRef = collection(db, 'artifacts', appId, 'public', 'data', 'rca_archives', activeRoomId, 'presence');
                const unsub = onSnapshot(presenceCollRef, (snap) => {
                    const now = Date.now(); const activeUsers = [];
                    snap.forEach(d => { const data = d.data(); if (now - data.lastActive < 25000) activeUsers.push({ uid: d.id, name: data.name }); });
                    setParticipants(activeUsers);
                });
                return () => { clearInterval(interval); unsub(); deleteDoc(presenceRef).catch(()=>{}); };
            }, [inRoom, activeRoomId, user, userName]);

            useEffect(() => {
                if (!user || !activeRoomId || !inRoom) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rca_archives', activeRoomId);
                const unsub = onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const docData = snap.data();
                        setActiveRoomName(docData.name);
                        isRemoteUpdate.current = true; 
                        try {
                            const parsed = JSON.parse(docData.payload);
                            if (parsed.fishbone) setData(parsed.fishbone);
                            if (parsed.fiveWhys) setFiveWhys(parsed.fiveWhys);
                            if (parsed.ftaData) setFtaData(parsed.ftaData);
                        } catch(e) {}
                    } else { leaveRoom(); showToast("Ruangan telah dihapus."); }
                });
                return () => unsub();
            }, [user, activeRoomId, inRoom]);

            useEffect(() => {
                if (!user || !activeRoomId || !inRoom) return;
                if (isRemoteUpdate.current) { isRemoteUpdate.current = false; return; }
                const save = async () => {
                    const payload = JSON.stringify({ fishbone: data, fiveWhys, ftaData });
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rca_archives', activeRoomId);
                        await setDoc(docRef, { name: activeRoomName || 'Ruang RCA', problem: data.problem, payload, updatedAt: new Date().toISOString() }, { merge: true });
                    } catch (e) {}
                };
                const timeoutId = setTimeout(save, 400);
                return () => clearTimeout(timeoutId);
            }, [data, fiveWhys, ftaData, activeRoomId, inRoom, user, activeRoomName]);

            // --- LOBBY ACTIONS ---
            const joinRoom = (id, name) => {
                if (!userName.trim()) { showToast("Silakan masukkan nama Anda terlebih dahulu."); return; }
                localStorage.setItem('rca_username', userName);
                setActiveRoomId(id); setActiveRoomName(name); setInRoom(true);
                try {
                    const url = new URL(window.location.href); url.searchParams.set('session', id);
                    window.history.replaceState(null, '', url.toString());
                } catch (e) {
                    console.warn("Tidak dapat mengubah URL di lingkungan preview ini.");
                }
            };
            const leaveRoom = () => {
                setInRoom(false); setActiveRoomId(null);
                try {
                    const url = new URL(window.location.href); url.searchParams.delete('session');
                    window.history.replaceState(null, '', url.toString());
                } catch (e) {
                    console.warn("Tidak dapat mengubah URL di lingkungan preview ini.");
                }
            };
            const createNewRoom = async () => {
                if (!userName.trim() || !newRoomName.trim()) { showToast("Nama ruang/peserta wajib diisi."); return; }
                localStorage.setItem('rca_username', userName);
                const initialData = formatPresetData(PRESETS['6M']); initialData.problem = newRoomProblem || 'Masalah Baru';
                const payload = JSON.stringify({ fishbone: initialData, fiveWhys, ftaData });
                try {
                    const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'rca_archives');
                    const newDoc = await addDoc(collRef, { name: newRoomName, problem: initialData.problem, payload, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), createdBy: user.uid });
                    setShowNewRoomForm(false); setNewRoomName(''); setNewRoomProblem(''); joinRoom(newDoc.id, newRoomName);
                } catch(e) { showToast("Gagal membuat ruang."); }
            };
            const deleteRoom = async (id, e) => {
                e.stopPropagation();
                if (!confirm("Hapus ruangan ini permanen?")) return;
                try { const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rca_archives', id); await deleteDoc(docRef); showToast("Ruangan dihapus."); } catch(e) {}
            };
            const handleShare = () => {
                const textArea = document.createElement("textarea"); textArea.value = window.location.href; 
                document.body.appendChild(textArea); textArea.select(); document.execCommand("copy"); document.body.removeChild(textArea);
                showToast('Link disalin! Bagikan ke tim.');
            };

            // --- EXPORT FUNCTIONS (EXCEL, PNG, & SMART PDF) ---
            const exportExcel = () => {
                if (!window.XLSX) { showToast("Library Excel belum dimuat."); return; }
                const rows = [];
                data.categories.forEach(cat => {
                    cat.causes.forEach(cause => {
                        rows.push({
                            'Kategori': cat.name, 'Penyebab Utama': cause.text, 'Sub-Cause Detail': cause.subCause,
                            'Validasi': cause.validity === 'valid' ? 'Valid' : cause.validity === 'invalid' ? 'Tidak Valid' : 'Belum Diuji',
                            'Rencana Tindakan (Action Plan)': cause.actionPlan, 'PIC': cause.pic, 'Due Date': cause.dueDate
                        });
                    });
                });
                const worksheet = XLSX.utils.json_to_sheet(rows);
                const workbook = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(workbook, worksheet, "CAPA");
                XLSX.writeFile(workbook, `RCA-Action-Plan-${Date.now()}.xlsx`);
                showToast("Excel diunduh!");
            };

            const exportPNG = async () => {
                setIsExporting(true);
                if (activeTab === 'fishbone' && svgRef.current) {
                    showToast("Menyiapkan Gambar PNG Fishbone...");
                    try {
                        const svgElement = svgRef.current.cloneNode(true);
                        svgElement.querySelectorAll('.no-print').forEach(el => el.remove());
                        svgElement.querySelectorAll('.canvas-outer-bg').forEach(el => { 
                            el.setAttribute('fill', '#ffffff'); el.setAttribute('stroke', '#e2e8f0'); 
                        });
                        
                        const svgBlob = new Blob([new XMLSerializer().serializeToString(svgElement)], { type: 'image/svg+xml;charset=utf-8' });
                        const blobURL = URL.createObjectURL(svgBlob);
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = SVG_WIDTH * 2; canvas.height = SVG_HEIGHT * 2;
                            const ctx = canvas.getContext('2d'); ctx.scale(2, 2);
                            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, SVG_WIDTH, SVG_HEIGHT);
                            ctx.drawImage(img, 0, 0, SVG_WIDTH, SVG_HEIGHT);
                            const link = document.createElement('a'); 
                            link.download = `Fishbone-Diagram-${Date.now()}.png`; link.href = canvas.toDataURL('image/png'); link.click();
                            URL.revokeObjectURL(blobURL); 
                            setIsExporting(false); showToast("PNG berhasil diunduh!");
                        };
                        img.onerror = () => { setIsExporting(false); showToast("Gagal memproses gambar PNG."); };
                        img.src = blobURL;
                    } catch(e) { setIsExporting(false); showToast("Gagal membuat PNG."); }
                } else if (mainContentRef.current) {
                    showToast(`Menyiapkan Gambar PNG ${activeTab.toUpperCase()}...`);
                    const element = mainContentRef.current;
                    element.classList.add('pdf-mode-active');
                    const noPrintElements = element.querySelectorAll('.no-print');
                    noPrintElements.forEach(el => el.style.display = 'none');
                    
                    await new Promise(resolve => setTimeout(resolve, 300));
                    html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#f8fafc', windowWidth: element.scrollWidth }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = `RCA-${activeTab.toUpperCase()}-${Date.now()}.png`; link.href = canvas.toDataURL('image/png'); link.click();
                        element.classList.remove('pdf-mode-active');
                        noPrintElements.forEach(el => el.style.display = '');
                        setIsExporting(false); showToast("PNG berhasil diunduh!");
                    }).catch(e => {
                        element.classList.remove('pdf-mode-active'); noPrintElements.forEach(el => el.style.display = '');
                        setIsExporting(false); showToast("Gagal membuat PNG.");
                    });
                } else { setIsExporting(false); }
            };

            const exportPDF = async () => {
                if (!window.html2pdf || !mainContentRef.current) return;
                setIsExporting(true); showToast("Menyiapkan Print Area (PDF)...");
                const element = mainContentRef.current;
                
                element.classList.add('pdf-mode-active');
                const noPrintElements = element.querySelectorAll('.no-print');
                noPrintElements.forEach(el => el.style.display = 'none');
                
                const svgBg = element.querySelector('.canvas-outer-bg');
                if (svgBg) { svgBg.setAttribute('fill', '#ffffff'); svgBg.setAttribute('stroke', '#e2e8f0'); }

                await new Promise(resolve => setTimeout(resolve, 300));

                const opt = {
                    margin:       [10, 10, 10, 10],
                    filename:     `RCA-Report-${activeTab.toUpperCase()}-${Date.now()}.pdf`,
                    image:        { type: 'jpeg', quality: 1 },
                    html2canvas:  { scale: 2, useCORS: true, windowWidth: element.scrollWidth, scrollY: 0, backgroundColor: '#f8fafc' },
                    jsPDF:        { unit: 'mm', format: 'a3', orientation: activeTab === 'fishbone' ? 'landscape' : 'portrait' },
                    pagebreak:    { mode: ['css', 'legacy'], avoid: ['tr', 'li', '.avoid-break'] }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    element.classList.remove('pdf-mode-active'); noPrintElements.forEach(el => el.style.display = '');
                    setIsExporting(false);
                }).catch((e) => {
                    element.classList.remove('pdf-mode-active'); noPrintElements.forEach(el => el.style.display = '');
                    setIsExporting(false); showToast("Gagal membuat PDF.");
                });
            };

            // --- EVENT HANDLERS FISHBONE ---
            const handlePointerDown = (e) => {
                if (e.target.closest('button') || e.target.closest('.no-pan') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('td') || e.target.closest('select') || editingItem) return;
                setIsPanning(true); setStartPan({ x: e.clientX - pan.x, y: e.clientY - pan.y }); setHighlightedCause(null);
            };
            const handlePointerMove = (e) => {
                if (dragItem) {
                    const dx = (e.clientX - dragItem.startX) / zoom; const dy = (e.clientY - dragItem.startY) / zoom;
                    if (dragItem.type === 'resize') { setTempOffsets({ [dragItem.id]: { dw: dx } }); } else { setTempOffsets({ [dragItem.id]: { dx, dy } }); }
                    
                    if (svgRef.current) {
                        const pt = svgRef.current.createSVGPoint();
                        pt.x = e.clientX; pt.y = e.clientY;
                        const svgP = pt.matrixTransform(svgRef.current.getScreenCTM().inverse());
                        setSvgCursor({ x: svgP.x, y: svgP.y, screenX: e.clientX, screenY: e.clientY });
                    }
                    return;
                }
                if (isPanning) setPan({ x: e.clientX - startPan.x, y: e.clientY - startPan.y });
            };
            const handlePointerUp = () => {
                setIsPanning(false);
                if (dragItem) {
                    const offsets = tempOffsets[dragItem.id] || {};
                    setData((prev) => {
                        const next = { ...prev };
                        if (dragItem.type === 'problem') {
                            next.problemOffsetX = (next.problemOffsetX || 0) + (offsets.dx || 0); next.problemOffsetY = (next.problemOffsetY || 0) + (offsets.dy || 0);
                        } else {
                            next.categories = next.categories.map((c) => {
                                if (c.id === dragItem.catId || c.id === dragItem.id) {
                                    const nextCat = { ...c };
                                    if (dragItem.type === 'cat' && dragItem.id === c.id) { nextCat.offsetX = (nextCat.offsetX || 0) + (offsets.dx || 0); nextCat.offsetY = (nextCat.offsetY || 0) + (offsets.dy || 0); }
                                    if (dragItem.type === 'cat_bone' && dragItem.catId === c.id) { nextCat.boneOffsetX = (nextCat.boneOffsetX || 0) + (offsets.dx || 0); nextCat.boneOffsetY = (nextCat.boneOffsetY || 0) + (offsets.dy || 0); }
                                    if (dragItem.catId === c.id) {
                                        nextCat.causes = nextCat.causes.map(cause => {
                                            const isMatchingCause = (dragItem.type === 'cause' && dragItem.id === cause.id) || (dragItem.type === 'cause_joint' && dragItem.id === `joint-${cause.id}`) || (dragItem.type === 'subcause' && dragItem.id === `sub-${cause.id}`) || (dragItem.type === 'resize' && dragItem.id === `resize-${cause.id}`);
                                            if (isMatchingCause) {
                                                const updatedCause = { ...cause };
                                                if (dragItem.type === 'cause') { updatedCause.offsetX = (cause.offsetX || 0) + (offsets.dx || 0); updatedCause.offsetY = (cause.offsetY || 0) + (offsets.dy || 0); }
                                                else if (dragItem.type === 'cause_joint') { updatedCause.jointOffsetRatio = (cause.jointOffsetRatio || 0) + (offsets.dy || 0) / 180; }
                                                else if (dragItem.type === 'subcause') { updatedCause.subOffsetX = (cause.subOffsetX || 0) + (offsets.dx || 0); updatedCause.subOffsetY = (cause.subOffsetY || 0) + (offsets.dy || 0); }
                                                else if (dragItem.type === 'resize') { updatedCause.customWidth = Math.max(100, (cause.customWidth || dragItem.startWidth) + (offsets.dw || 0)); }
                                                return updatedCause;
                                            }
                                            return cause;
                                        });
                                    }

                                                                <td className="p-2 border-r align-top"><textarea rows="4" value={cause.subCause} onChange={(e) => handleTableEdit(cat.id, cause.id, 'subCause', e.target.value)} className="w-full bg-transparent outline-none p-1 text-slate-600 text-xs" /></td>
                                                                <td className="p-2 border-r align-top"><textarea rows="4" value={cause.actionPlan} onChange={(e) => handleTableEdit(cat.id, cause.id, 'actionPlan', e.target.value)} className="w-full bg-transparent outline-none p-1 text-slate-700 text-xs" /></td>
                                                                <td className="p-2 border-r align-top"><input type="text" value={cause.pic} onChange={(e) => handleTableEdit(cat.id, cause.id, 'pic', e.target.value)} className="w-full bg-transparent outline-none p-1 text-slate-600 text-xs" /></td>
                                                                <td className="p-2 border-r align-top"><input type="date" value={cause.dueDate} onChange={(e) => handleTableEdit(cat.id, cause.id, 'dueDate', e.target.value)} className="w-full bg-transparent outline-none p-1 text-slate-600 text-xs" /></td>
                                                                <td className="p-2 text-center align-top no-print"><button onClick={(e) => handleDeleteCause(cat.id, idx, e)} className="text-red-400 hover:text-red-600 p-1.5"><Trash2 className="w-4 h-4 mx-auto" /></button></td>
                                                            </tr>
                                                        ))
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 5 WHYS TAB */}
                        {activeTab === '5whys' && (
                            <div className="flex flex-col flex-1 bg-slate-50 overflow-y-auto animate-in fade-in p-4 md:p-8">
                                <div className="max-w-4xl mx-auto w-full space-y-6">
                                    <div className="bg-white border rounded-xl p-6 shadow-sm avoid-break">
                                        <h2 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Layers className="w-6 h-6 text-blue-600" /> 5 Whys Analysis</h2>
                                        <div className="mb-4">
                                            <label className="text-xs font-bold text-slate-500 uppercase block mb-2">Problem Statement</label>
                                            <textarea rows="2" value={fiveWhys.problem} onChange={(e) => setFiveWhys({...fiveWhys, problem: e.target.value})} className="w-full bg-red-50 border border-red-200 text-red-900 rounded-lg p-4 font-semibold text-lg outline-none" />
                                        </div>
                                    </div>
                                    <div className="space-y-4 pl-4 relative before:absolute before:inset-0 before:ml-[31px] before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-1 before:bg-gradient-to-b before:from-transparent before:via-slate-300 before:to-transparent">
                                        {fiveWhys.whys.map((why, idx) => (
                                            <div key={idx} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse avoid-break">
                                                <div className="flex items-center justify-center w-10 h-10 rounded-full border-4 border-white bg-blue-500 text-white font-bold shadow shrink-0 md:order-1 md:odd:-translate-x-1/2 md:even:translate-x-1/2 z-10">{idx + 1}</div>
                                                <div className="w-[calc(100%-4rem)] md:w-[calc(50%-3rem)] bg-white border p-4 rounded-xl shadow-sm">
                                                    <div className="flex justify-between items-center mb-2"><h3 className="font-bold text-sm">Why {idx + 1}?</h3><button onClick={() => removeWhy(idx)} className="text-slate-400 no-print"><Trash2 className="w-4 h-4" /></button></div>
                                                    <textarea rows="2" value={why} onChange={(e) => updateWhy(idx, e.target.value)} className="w-full bg-transparent outline-none text-slate-600 resize-y" />
                                                </div>
                                            </div>
                                        ))}
                                        <div className="relative flex justify-center z-10 no-print pt-4"><button onClick={addWhy} className="bg-white border px-4 py-2 rounded-full font-medium shadow-sm"><Plus className="w-4 h-4 inline" /> Tambah Why</button></div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-6 avoid-break">
                                        <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-6">
                                            <label className="text-xs font-bold text-emerald-700 uppercase mb-2 block"><Check className="w-4 h-4 inline" /> Root Cause</label>
                                            <textarea rows="4" value={fiveWhys.rootCause} onChange={(e) => setFiveWhys({...fiveWhys, rootCause: e.target.value})} className="w-full bg-transparent text-emerald-900 font-medium outline-none resize-none" />
                                        </div>
                                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-6">
                                            <label className="text-xs font-bold text-blue-700 uppercase mb-2 block"><FileText className="w-4 h-4 inline" /> Action Plan</label>
                                            <textarea rows="4" value={fiveWhys.actionPlan} onChange={(e) => setFiveWhys({...fiveWhys, actionPlan: e.target.value})} className="w-full bg-transparent text-blue-900 font-medium outline-none resize-none" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* FTA TAB */}
                        {activeTab === 'fta' && (
                            <div className="flex flex-col flex-1 bg-slate-50 overflow-auto animate-in fade-in p-8 print-wrapper">
                                <div className="w-full min-w-max mx-auto bg-white p-8 rounded-2xl shadow-sm border">
                                    <div className="mb-10 text-center">
                                        <h2 className="text-2xl font-bold flex items-center justify-center gap-2"><Network className="w-6 h-6 text-blue-600" /> Fault Tree Analysis</h2>
                                    </div>
                                    <div className="fta-tree flex justify-center w-full">
                                        <ul>{renderFTANode(ftaData, true)}</ul>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODAL AI & EDIT */}
                    {editingItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 no-print">
                            <div className="bg-white rounded-2xl p-6 shadow-2xl space-y-4 w-full max-w-md">
                                <div className="flex justify-between pb-2 border-b"><h3 className="font-bold text-sm">Edit Penyebab</h3><button onClick={() => setEditingItem(null)}><X className="w-4 h-4" /></button></div>
                                <div className="space-y-3">
                                    <div><label className="text-xs font-semibold block mb-1">Akar Masalah Utama:</label><input type="text" id="quick-edit-cause" defaultValue={editingItem.text} className="w-full bg-slate-50 border rounded-xl px-3 py-2 outline-none" /></div>
                                    <div><label className="text-xs font-semibold block mb-1">Sub-Cause:</label><textarea rows="3" id="quick-edit-subcause" defaultValue={editingItem.subCause} className="w-full bg-slate-50 border rounded-xl px-3 py-2 outline-none" /></div>
                                </div>
                                <div className="flex justify-end space-x-2 pt-2">
                                    <button onClick={() => setEditingItem(null)} className="px-3.5 py-1.5 rounded-lg text-xs bg-slate-100">Batal</button>
                                    <button onClick={() => { const cInput = document.getElementById('quick-edit-cause'); const sInput = document.getElementById('quick-edit-subcause'); if (cInput && sInput) saveQuickEdit(cInput.value, sInput.value); }} className="px-4 py-1.5 rounded-lg text-xs bg-blue-600 text-white">Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAIModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 no-print">
                            <div className="bg-white rounded-2xl p-6 shadow-2xl space-y-5 w-full max-w-lg">
                                <div className="flex justify-between pb-3 border-b"><h3 className="font-bold">AI Generator ({activeTab.toUpperCase()})</h3><button onClick={() => !isGenerating && setShowAIModal(false)}><X className="w-4 h-4" /></button></div>
                                <div className="space-y-4">
                                    <div>
                                        <select value={aiModel} onChange={(e) => setAiModel(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm outline-none">
                                            <option value="gemini-3.1-flash-lite">3.1 Flash-Lite (Cepat)</option><option value="gemini-1.5-flash">1.5 Flash (Standar)</option><option value="gemini-1.5-pro">1.5 Pro (Kompleks)</option>
                                            <option value="custom">Input Model Kustom...</option>
                                        </select>
                                        {aiModel === 'custom' && (
                                            <input type="text" value={customAiModel} onChange={(e) => setCustomAiModel(e.target.value)} placeholder="Contoh: gemini-2.0-flash-exp" className="w-full bg-white border border-blue-300 rounded-lg px-3 py-2 text-sm outline-none mt-2 focus:border-blue-500 shadow-inner" />
                                        )}
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold block mb-1">Deskripsi Masalah / Insiden Utama:</label>
                                        <textarea rows="3" value={aiPrompt} onChange={(e) => setAiPrompt(e.target.value)} placeholder="Deskripsi masalah..." className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm outline-none" />
                                    </div>
                                    <div className="bg-blue-50 border border-blue-100 rounded-xl p-3">
                                        <label className="text-xs font-bold text-blue-800 flex items-center gap-1.5 mb-1.5"><Sparkles className="w-3.5 h-3.5" /> Fakta Baru / Temuan Tim (Refinement)</label>
                                        <textarea rows="2" value={aiAdditionalFacts} onChange={(e) => setAiAdditionalFacts(e.target.value)} placeholder="Opsional: Contoh 'Ternyata suhu memuncak hingga 90 derajat'. AI akan memperbarui diagram tanpa merombak total." className="w-full bg-white border border-blue-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-400" />
                                    </div>
                                    {aiError && <div className="text-xs text-red-600 bg-red-50 p-2 rounded-lg">{aiError}</div>}
                                </div>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button onClick={() => setShowAIModal(false)} disabled={isGenerating} className="px-4 py-2 rounded-lg text-xs bg-slate-100">Batal</button>
                                    <button onClick={handleAIGenerate} disabled={isGenerating || !aiPrompt.trim()} className="px-5 py-2 rounded-lg text-xs bg-indigo-600 text-white flex gap-2 items-center">{isGenerating ? <Loader2 className="w-4 h-4 animate-spin"/> : <Bot className="w-4 h-4"/>} Generate</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMsg && <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] bg-slate-800 text-white px-5 py-3 rounded-full font-semibold text-sm flex gap-2"><Check className="w-4 h-4 text-green-400" /> {toastMsg}</div>}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
